name: QA — Directive Validation

on:
  pull_request:
    branches: [main]
  # push covers only main (the post-merge run). Branch commits are covered by
  # the pull_request trigger — listing claude/** here too made every PR commit
  # run the whole workflow twice.
  push:
    branches: [main]
  # Manual escape hatch (owner-approved 2026-07-19): pull_request event
  # delivery has died repo-wide before — this lets a session or the Actions
  # tab run the gate by hand on any ref. A dispatch run on the PR's head SHA
  # satisfies the merge gate; the policy requires the gate passing, not a
  # particular triggering event.
  workflow_dispatch:

# Least privilege: validation only reads the repo.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Directives
    runs-on: ubuntu-latest
    # Bounded because it fetches: checkout, and npx for the validators. Fast in
    # practice (~7s), which is exactly why the missing bound went unnoticed —
    # a job that always finishes quickly is still unbounded when it does not.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Self-application: run the same secret scan every downstream project runs
      # (global.md → Security), dogfooding the composite straight from its
      # template path — a composite action works from any repo path.
      - name: Secret scan
        uses: ./templates/actions/secret-scan

      - name: Check internal URLs resolve (hard fail)
        run: node .github/scripts/check-links.js --internal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check file paths in CLAUDE.md exist
        run: node .github/scripts/check-paths.js

      - name: Check required sections present
        run: node .github/scripts/check-sections.js

      - name: Check plugin + marketplace structure
        run: node .github/scripts/check-plugin.js

      - name: Check secret-scan pattern in sync
        run: node .github/scripts/check-secret-scan.js

      - name: Check export boundary (EXPORTS.json)
        run: node .github/scripts/check-exports.js

      - name: Workflow cross-reference guard
        run: node .github/scripts/workflow-ref-guard.mjs

      # The logical map is generated from EXPORTS.json, so a committed page that
      # no longer matches the manifest is drift — fail here rather than let the
      # map quietly describe a repo that has moved on.
      - name: Check the logical map is regenerated
        run: node .github/scripts/build-logical-map.js --check

      - name: Validate workflow YAML
        run: |
          python3 -c "
          import yaml, sys, glob
          files = glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml') \
                + glob.glob('templates/workflows/*.yml') + glob.glob('templates/workflows/*.yaml') \
                + glob.glob('templates/actions/*/action.yml')
          for f in files:
              yaml.safe_load(open(f))
              print(f'OK: {f}')
          "

      # These pairs are intentionally byte-identical (the template IS the live copy).
      # ci-monitor.yml is exempt: its watched-workflow list intentionally differs.
      - name: Check intentionally-identical file pairs
        run: |
          diff .claude/settings.json templates/claude-settings.json
          diff .github/workflows/codex-monitor.yml templates/workflows/codex-monitor.yml
          diff .github/workflows/pages-monitor.yml templates/workflows/pages-monitor.yml
          diff .github/workflows/pages-retry.yml templates/workflows/pages-retry.yml
          # The guard ships to projects from templates/; this repo runs the .github/
          # copy. Without this diff a repair could land in the copy we execute while
          # the shipped one stays broken — and QA would stay green either way.
          diff .github/scripts/workflow-ref-guard.mjs templates/scripts/workflow-ref-guard.mjs
          diff .claude/hooks/session-start.sh templates/claude-hooks/session-start.sh
          echo "OK: paired files in sync"

      # The SessionStart hook runs at the start of every web session in this repo
      # and in every project scaffolded from the template. A syntax error there
      # breaks session startup, so parse it here rather than discovering it live.
      - name: Check SessionStart hook parses and stays executable
        run: |
          bash -n .claude/hooks/session-start.sh
          # A mode-only change slips past everything else here: `bash -n` reads a
          # non-executable file happily and the paired-file `diff` compares content,
          # not modes. The registered hook would then fail permission-denied at every
          # session start. Assert the bit on the live hook AND the template projects
          # copy, since a non-executable template propagates the fault downstream.
          test -x .claude/hooks/session-start.sh \
            || { echo "FAIL: .claude/hooks/session-start.sh is not executable"; exit 1; }
          test -x templates/claude-hooks/session-start.sh \
            || { echo "FAIL: templates/claude-hooks/session-start.sh is not executable"; exit 1; }
          echo "OK: SessionStart hook parses and both copies are executable"

      # The two Pages landing pages (site root + /docs/ gallery) deliberately
      # duplicate one :root palette block; keep the copies from drifting.
      - name: Check landing-page palette blocks in sync
        run: |
          extract() { sed -n '/:root {/,/^    }/p' "$1"; }
          diff <(extract index.html) <(extract docs/site/index.html)
          echo "OK: landing-page palette blocks in sync"

  check-external-links:
    name: Check External Links (warn only)
    runs-on: ubuntu-latest
    # The most network-dependent job here — it resolves external URLs, so a slow
    # or black-holing host is its normal failure mode. Warn-only means a hang
    # blocks the run without ever reporting anything, which is worse than a red.
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check external URLs resolve
        run: node .github/scripts/check-links.js --external
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dogfood the exported UI-testing standard (test.md / templates/ui-tests) on
  # this repo's interactive Pages artifact: docs/site/logical-map.html (the
  # repo map, logical view — the physical view was retired 2026-07-21).
  # Blocking: the map is a static, self-contained file with no backend, so the
  # run is deterministic (unlike the downstream local-server UI tests).
  ui-tests:
    name: Repo Map UI (Playwright)
    runs-on: ubuntu-latest
    # ⚠️ BOUND THE JOB. Without this, a wedged browser download runs to GitHub's
    # 6-hour default and the PR shows neither pass nor fail for the whole time —
    # no signal at all, which reads as "still working" and then as nothing. This
    # job normally finishes in ~4 minutes; 20 is generous and still reports.
    # (Self-inflicted proof: run 32269445117 sat 57 minutes on the install step
    # below while a PR waited on it, 2026-08-19.)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Same fix as templates/actions/ui-suite: the browser download is the
      # slowest thing here and was repeated every run. Keyed on this workflow
      # file so a deliberate bump misses; restore-keys means an unrelated edit
      # still reuses the previous browsers rather than starting cold.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('.github/workflows/qa.yml') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          # Re-runs cheaply when the browser revision is already cached; the
          # system libraries in /usr/lib are never cached, so --with-deps stays.
          npx playwright install --with-deps chromium

      # Keep in sync with CLAUDE.md "Local gate": the maps' HTML is validated
      # here on every run (locally it's only needed when a map changed).
      - name: Validate map HTML
        run: npx --yes html-validate docs/site/logical-map.html

      - name: Repo map UI checks (logical view)
        run: node .github/scripts/check-repo-map-ui.js
