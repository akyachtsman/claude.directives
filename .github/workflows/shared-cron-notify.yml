# shared-cron-notify.yml — a scheduled job that runs the project's own task
# script, which emails through notify-email.js, called by the
# .github/workflows/cron-notify.yml of a project with a scheduled task (#460
# step 4). The caller a project writes is templates/workflows/cron-notify.yml,
# pinned `@v1` (or `@vX.Y.Z`, or a commit SHA).
#
# Secrets go by name, never `secrets: inherit`: why, in shared-qa.yml's header.
#
# What stays the project's: the schedule (its `on:`, with the DST notes in the
# template), and the task itself, .github/scripts/notify-task.js (or the
# `task-script` input), which is project code. What comes from this repo, at
# the commit this workflow was called at: notify-email.js and the commonjs
# package.json, staged beside the task script, since the task requires
# './notify-email.js'. The dependencies install from that package.json with no
# lockfile and no cache, so the project commits neither.
#
# The task's environment. `env` does not pass into a called workflow, so only
# the names below reach the task: the email transport (ALERT_TO, ALERT_FROM,
# SMTP_HOST, SMTP_PORT, SMTP_USER as variables, SMTP_PASS as a secret) and the
# backend pair data.md names (DB_URL as a variable, DB_SERVICE_KEY as a
# secret). A task that needs another name is a finding for this repo: add it
# here as an optional secret or a variable read, never a project copy.
#
# How a called workflow works, and why: docs/internal/shared-workflows.md.
name: Shared Scheduled Notification

on:
  workflow_call:
    inputs:
      task-script:
        description: The project's task script, run with node from its own directory.
        type: string
        default: .github/scripts/notify-task.js
      force:
        description: Bypasses any in-script time guard; the task sees FORCE=true. Pass the caller's manual-run input.
        type: boolean
        default: false
    secrets:
      DIRECTIVES_READ_TOKEN:
        description: Needed only if claude.directives turns private, where the run's own token cannot read it. A read-only token for that one repo; unset, the shared files are fetched with the run's own token.
        required: false
      SMTP_PASS:
        required: false
      DB_SERVICE_KEY:
        required: false

# Least privilege: the job only reads the repo; email goes out via SMTP secrets.
permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10            # always cap scheduled jobs so a hang can't run for hours
    steps:
      - uses: actions/checkout@v7

      # The shared files at the commit this workflow was called at; why:
      # shared-qa.yml's header.
      - name: Resolve the shared files' commit
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WF_REPO" ] || [ -z "$WF_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are empty, so the shared files cannot be locked to the called version."
            exit 1
          fi
          echo "Shared files: $WF_REPO@$WF_SHA"

      - name: Fetch the shared files
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          token: ${{ secrets.DIRECTIVES_READ_TOKEN || github.token }}
          ref: ${{ job.workflow_sha }}
          path: .claude-directives
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      # Beside the task, which requires './notify-email.js'. A project's own
      # copy is replaced for this run, with a notice when it differed.
      - name: Stage notify-email.js and its package.json
        id: stage
        env:
          TASK: ${{ inputs.task-script }}
        run: |
          if [ ! -f "$TASK" ]; then
            echo "::error::the task script $TASK does not exist; it is the project's own (templates/scripts/notify-task.js is the starting point)."
            exit 1
          fi
          dir=$(dirname -- "$TASK")
          for f in notify-email.js package.json; do
            src=".claude-directives/templates/scripts/$f"
            dst="$dir/$f"
            if [ -f "$dst" ] && ! cmp -s "$src" "$dst"; then
              echo "::notice::$dst differs from the shared copy and is replaced for this run."
            fi
            cp "$src" "$dst"
          done
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install deps
        working-directory: ${{ steps.stage.outputs.dir }}
        run: npm install --no-package-lock --no-audit --no-fund

      # The working directory is the task's own: a
      # project's task body may use paths relative to it.
      - name: Run task
        working-directory: ${{ steps.stage.outputs.dir }}
        env:
          # --- the backend pair data.md names ---
          DB_URL: ${{ vars.DB_URL }}
          DB_SERVICE_KEY: ${{ secrets.DB_SERVICE_KEY }}
          # --- email transport (consumed by notify-email.js) ---
          # Host/port/user/from are non-sensitive → Variables; only SMTP_PASS is a secret.
          ALERT_TO:   ${{ vars.ALERT_TO || vars.SMTP_USER }}   # workflow fallback (script requires ALERT_TO)
          ALERT_FROM: ${{ vars.ALERT_FROM }}                   # empty → notify-email.js defaults to SMTP_USER
          SMTP_HOST:  ${{ vars.SMTP_HOST }}
          SMTP_PORT:  ${{ vars.SMTP_PORT }}
          SMTP_USER:  ${{ vars.SMTP_USER }}
          SMTP_PASS:  ${{ secrets.SMTP_PASS }}
          FORCE:      ${{ inputs.force }}
          TASK: ${{ inputs.task-script }}
        run: node "$GITHUB_WORKSPACE/$TASK"
