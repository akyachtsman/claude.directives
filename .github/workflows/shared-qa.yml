# shared-qa.yml — static checks + Playwright against a local server, called
# by every project's .github/workflows/qa.yml (#460 step 4). The caller a
# project writes is templates/workflows/qa.yml: its own triggers, permissions
# and BUILD_PATHS, and one job that calls this file `@v1`, the moving tag on
# the latest release (`@vX.Y.Z` or a commit SHA stays put). Releases are cut
# by .github/workflows/release.yml: docs/internal/shared-workflows.md →
# Releases.
#
# Jobs:
#   static-checks — the secret-scan composite, the contrast guardrail and the
#                   web-guards composite (native dialogs, escaped text in a
#                   text sink, npm audit); the blocking gate.
#   ui-tests      — Playwright against a local server through the ui-suite
#                   composite (skipped with a notice only while the repo has
#                   no index.html yet and no build). BLOCKING by default for
#                   the static/no-backend tier, where the suite runs fully
#                   against the bundled http-server; advisory-run: true is an
#                   explicit, temporary opt-out, flipped back once the
#                   blocking issue is fixed.
#
# The CI-build opt-in (global.md -> Hosting & Deployment): a caller sets
# build-cmd and site-dir to the SAME values as its pages-deploy.yml. The UI job
# then runs the build and serves site-dir, so it tests what is deployed.
# Without the opt-in both stay as shipped: no build, the repo root is served.
# It serves the tree UNFILTERED (dotfiles and deny-listed paths included), so
# it tests the site's behaviour, not what the deploy leaves out; it does refuse
# what that deploy refuses (a site-dir outside the repository, or a symlink in
# the site), so a green PR cannot merge into a red deploy.
#
# A project with checks of its own (a path guard, unit tests) runs them in a
# SIBLING job of its caller and makes `qa` wait on it, so a red project check
# still stops the suite. The called workflow takes no command to run, because a
# sibling job keeps the project's own setup (its Node or Python version, its
# install) in the project's file (claude.prop pilot, 2026-10-25). The template
# shows the slot.
#
# A project that added contrast pairs to its own .github/scripts/check-contrast.js
# names that copy in `contrast-script`; without it the shared run checks only
# the shipped pairs, and says so when it sees a local copy that differs.
#
# Secrets go by NAME, not `secrets: inherit`: GitHub documents `inherit` only
# for callers in the same organization or enterprise, and the projects live
# under a personal account (Codex, #467).
#
# How a called workflow works, and why: docs/internal/shared-workflows.md. In
# short:
#   - Every shared file (the secret-scan and ui-suite composites, the scripts)
#     comes from THIS repo at the exact commit the caller called
#     (job.workflow_sha), checked out into .claude-directives/. A `./` path in a
#     called workflow resolves against the caller's checkout, so nothing here
#     names .github/actions/ or .github/scripts/ of the caller for a shared file.
#   - Settings are inputs: `env` does not pass into a called workflow.
#   - The ui-suite composite reads check-ui-viewports.js (and the commonjs
#     package.json beside it) from .github/scripts/ by fixed path, so the job
#     stages those two files there from the shared checkout. A project's own copy
#     is replaced for the run, with a notice when it differed.

name: Shared QA — Static + UI Tests

on:
  workflow_call:
    inputs:
      tests-dir:
        description: Directory holding the project's playwright.config.js and package.json.
        type: string
        default: .github/scripts/ui-tests
      build-cmd:
        description: CI-build opt-in only. Runs from the repo root and writes site-dir; empty means no build.
        type: string
        default: ''
      site-dir:
        description: The directory served to the suite; '.' is the repo root.
        type: string
        default: '.'
      contrast-args:
        description: Extra arguments for check-contrast.js, e.g. `--tokens css/theme.css`. Split on whitespace.
        type: string
        default: ''
      contrast-script:
        description: The project's own contrast script, e.g. `.github/scripts/check-contrast.js` with its added pairs, run instead of the shared one. Empty runs the shared copy.
        type: string
        default: ''
      advisory-run:
        description: true makes ONLY the Playwright run step advisory. A temporary opt-out for a known open UI failure; flip it back once fixed.
        type: boolean
        default: false
      grep-invert:
        description: Exported to the UI job as GREP_INVERT, for a project whose playwright.config.js reads it into grepInvert to leave tests out of the PR run (claude.trading's `live only`). Empty by default. The shared kit does not read it.
        type: string
        default: ''
      native-dialog-guard:
        description: true fails a call to the browser's own confirm(), alert() or prompt() in the site's code (design.md -> 9. Confirmations). false turns the guard off.
        type: boolean
        default: true
      escape-sink-guard:
        description: true fails an HTML-escaped value in a text sink (textContent, .value, setAttribute('title'), a dialog), where the person reads the entity codes. false turns the guard off.
        type: boolean
        default: true
      audit-deps:
        description: true runs `npm audit` on every npm dependency tree in the repository and fails at audit-level or above. false turns the audit off.
        type: boolean
        default: true
      guard-skip:
        description: Files or directories (from the repo root) the native-dialog and escape-sink guards leave alone, one per line; prefix `native-dialog:` or `escape-sink:` for one guard only. An entry naming nothing fails.
        type: string
        default: ''
      text-sinks:
        description: Names of the project's own functions whose arguments are shown as plain text (its own dialog, say), for the escape-sink guard. The house dialogs are included already.
        type: string
        default: ''
      audit-level:
        description: The lowest npm advisory severity that fails the audit (low, moderate, high, critical).
        type: string
        default: high
      audit-skip:
        description: Manifests the audit leaves out (a directory or its package.json), one per line. An entry naming nothing fails.
        type: string
        default: ''
      ui-timeout-minutes:
        description: The UI job's bound. 120 is the fleet floor for a ui-suite caller; raise it, never lower it.
        type: number
        default: 120
    secrets:
      DIRECTIVES_READ_TOKEN:
        description: Needed only if claude.directives turns private, where the run's own token cannot read it. A read-only token for that one repo; unset, the shared files are fetched with the run's own token.
        required: false
      TEST_AUTH_CREDENTIAL:
        required: false
      TEST_AUTH_EMAIL:
        required: false

# Least privilege: these jobs only read the repo and run tests. A caller can
# narrow this further, never widen it.
permissions:
  contents: read

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    # 10, not 5, since the web guards: an npm install and one `npm audit` per
    # dependency tree, each a registry round trip.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # job.workflow_* are github.com-only. Empty means the version this run
      # is locked to is unknown, and checkout would silently fall back to the
      # default branch, so stop instead.
      - name: Resolve the shared files' commit
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
          WF_REF: ${{ job.workflow_ref }}
        run: |
          if [ -z "$WF_REPO" ] || [ -z "$WF_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are empty, so the shared files cannot be locked to the called version."
            exit 1
          fi
          echo "Shared files: $WF_REPO@$WF_SHA (called as $WF_REF)"
          echo "Shared files: \`$WF_REPO@$WF_SHA\` (called as \`$WF_REF\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the shared files
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          token: ${{ secrets.DIRECTIVES_READ_TOKEN || github.token }}
          ref: ${{ job.workflow_sha }}
          path: .claude-directives
          persist-credentials: false

      # Keep the shared checkout out of the caller's own scans: the secret scan
      # reads untracked files that are not ignored.
      - name: Ignore the shared checkout
        run: echo '/.claude-directives/' >> .git/info/exclude

      - uses: ./.claude-directives/templates/actions/secret-scan

      # WCAG AA check against this project's design tokens: styles/tokens.css or
      # css/tokens.css by default; elsewhere, pass `--tokens <file>` in
      # contrast-args. The shared copy runs from the shared checkout, where the
      # commonjs package.json beside it applies whatever the project's root
      # declares. A project's own copy (contrast-script) runs from the caller's
      # checkout and needs its own package.json beside it: every .js under
      # .github/scripts/ is CommonJS and runs only because that manifest says
      # "type": "commonjs". Without it Node takes the module type from the ROOT
      # package.json, and a Vite/Astro/SvelteKit root ("type": "module") kills
      # the step with "require is not defined in ES module scope". With no
      # stylesheet at all the check exits with a notice until /design-intake
      # creates tokens.css; once the project has any CSS, a missing tokens
      # file FAILS it.
      # Without contrast-script, a local .github/scripts/check-contrast.js that
      # differs from the shared one gets a warning: its added pairs are not
      # checked by this run (claude.prop pilot, 2026-10-25: 11 pairs checked of
      # its 13).
      - name: Contrast guardrail (WCAG AA)
        env:
          CONTRAST_ARGS: ${{ inputs.contrast-args }}
          CONTRAST_SCRIPT: ${{ inputs.contrast-script }}
        run: |
          read -r -a args <<< "$CONTRAST_ARGS"
          shared=.claude-directives/templates/scripts/check-contrast.js
          if [ -n "$CONTRAST_SCRIPT" ]; then
            if [ ! -f "$CONTRAST_SCRIPT" ]; then
              echo "::error::contrast-script names $CONTRAST_SCRIPT, which is not a file in this repository."
              exit 1
            fi
            echo "Contrast: the project's own $CONTRAST_SCRIPT (contrast-script)" >> "$GITHUB_STEP_SUMMARY"
            node "$CONTRAST_SCRIPT" "${args[@]}"
            exit
          fi
          local_copy=.github/scripts/check-contrast.js
          if [ -f "$local_copy" ] && ! cmp -s "$shared" "$local_copy"; then
            echo "::warning::$local_copy differs from the shared copy, and this run checks only the shared pairs. If it adds pairs of its own, pass contrast-script: $local_copy."
          fi
          node "$shared" "${args[@]}"

      # Three guards from apfp.claude's CI, for every project (owner ruling,
      # 2026-10-27): no native confirm/alert/prompt, no HTML-escaped value in a
      # text sink, and `npm audit` of every dependency tree. Each has its own
      # off switch and the code guards a per-file skip list; what each reads and
      # why is in its script's header (templates/actions/web-guards/). With the
      # CI-build opt-in, site-dir is the build's OUTPUT and does not exist yet
      # in this job, so the code guards read the repository's own source.
      # Runs after a red contrast step too, so one run names every finding.
      - name: Web guards
        if: ${{ !cancelled() }}
        uses: ./.claude-directives/templates/actions/web-guards
        with:
          site-dir: ${{ inputs.build-cmd == '' && inputs.site-dir || '.' }}
          native-dialog: ${{ inputs.native-dialog-guard }}
          escape-sink: ${{ inputs.escape-sink-guard }}
          audit-deps: ${{ inputs.audit-deps }}
          guard-skip: ${{ inputs.guard-skip }}
          text-sinks: ${{ inputs.text-sinks }}
          audit-level: ${{ inputs.audit-level }}
          audit-skip: ${{ inputs.audit-skip }}

  ui-tests:
    name: UI Tests (local server)
    needs: [static-checks]
    runs-on: ubuntu-latest
    # 120 is the fleet FLOOR for a ui-suite caller. Set HIGHER if your suite
    # needs it, never lower, and raise it BEFORE adding projects. Why 120 (measurements, arithmetic, what it does NOT cover): the
    # CALLER BOUND section of templates/actions/ui-suite/action.yml's header.
    timeout-minutes: ${{ inputs.ui-timeout-minutes }}
    env:
      BUILD_CMD: ${{ inputs.build-cmd }}
      SITE_DIR: ${{ inputs.site-dir }}
      # A project's own job-env setting for its suite (claude.trading pilot,
      # 2026-10-26: S10, S11 and S14 need the live backend and run in qa-live
      # only). Empty by default, which a config reading it treats as unset.
      GREP_INVERT: ${{ inputs.grep-invert }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the shared files' commit
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WF_REPO" ] || [ -z "$WF_SHA" ]; then
            echo "::error::job.workflow_repository / job.workflow_sha are empty, so the shared files cannot be locked to the called version."
            exit 1
          fi
          echo "Shared files: $WF_REPO@$WF_SHA"

      - name: Fetch the shared files
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          token: ${{ secrets.DIRECTIVES_READ_TOKEN || github.token }}
          ref: ${{ job.workflow_sha }}
          path: .claude-directives
          persist-credentials: false

      - name: Ignore the shared checkout
        run: echo '/.claude-directives/' >> .git/info/exclude

      - name: Stage the scripts the ui-suite composite reads by path
        run: |
          mkdir -p .github/scripts
          for f in check-ui-viewports.js package.json; do
            src=".claude-directives/templates/scripts/$f"
            dst=".github/scripts/$f"
            if [ -f "$dst" ] && ! cmp -s "$src" "$dst"; then
              echo "::notice::$dst differs from the shared copy and is replaced for this run."
            fi
            cp "$src" "$dst"
          done

      # CI-build opt-in only: build exactly as the deploy does and serve its
      # output, so the suite tests what is deployed rather than the unbuilt
      # tree. With build-cmd empty these two steps are skipped.
      - name: Setup Node (build)
        if: env.BUILD_CMD != ''
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # setup-node v5+ turns npm caching ON by itself when the root
          # package.json names npm in `packageManager` (or devEngines), and then
          # needs a lockfile. This step never cached under v4; keep it that way.
          package-manager-cache: false

      - name: Build
        if: env.BUILD_CMD != ''
        run: bash -eo pipefail -c "$BUILD_CMD"

      # Refuse what the deploy refuses, so a green PR cannot merge into a red
      # deploy: a site directory resolving outside the repository, or a
      # symlink in the site (the deploy publishes link TARGETS). A symlink fails
      # where that deploy is installed (.github/workflows/pages-deploy.yml) or a
      # build implies it (the opt-in is Actions-source); otherwise the repo is
      # branch-source, where the managed build publishes links differently, so
      # it only warns. Also exports the normalised directory ('' and '/'
      # mean the repo root) to serve, as a step output. With no build and no
      # index.html yet (a fresh repo) there is nothing to load: it skips the
      # suite with a notice rather than hand Playwright a directory listing.
      # The symlink scan runs from inside the site, so the excluded names
      # apply only BELOW the root (a site directory that is itself called
      # node_modules is still scanned).
      - name: Check the site directory
        id: site
        run: |
          src="${SITE_DIR%/}"; [ -n "$src" ] || src="."
          if [ -z "$BUILD_CMD" ] && [ ! -f "$src/index.html" ]; then
            echo "::notice::No index.html yet — skipping the browser suite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$src/index.html" ]; then
            echo "::error::$src/index.html is missing: nothing for the suite to load."
            exit 1
          fi
          ws=$(realpath -e .)
          real=$(realpath -e -- "$src")
          case "$real/" in
            "$ws"/*) ;;
            *) echo "::error::SITE_DIR=$SITE_DIR resolves to $real, outside the repository; pages-deploy.yml refuses it."; exit 1 ;;
          esac
          links=$(cd "$real" && find . \( -name .git -o -name .github -o -name node_modules -o -name .claude-directives \) -prune -o -type l -printf '%P -> %l\n')
          if [ -n "$links" ] && { [ -n "$BUILD_CMD" ] || [ -f .github/workflows/pages-deploy.yml ]; }; then
            echo "::error::symlinks in the site, which pages-deploy.yml refuses; replace them with real files:"
            printf '%s\n' "$links"
            exit 1
          elif [ -n "$links" ]; then
            echo "::warning::symlinks in the site; pages-deploy.yml (Actions-source) refuses them: $(printf '%s; ' "$links")"
          fi
          echo "root=$src" >> "$GITHUB_OUTPUT"

      - uses: ./.claude-directives/templates/actions/ui-suite
        if: steps.site.outputs.skip != 'true'
        with:
          tests-dir: ${{ inputs.tests-dir }}
          app-url: http://localhost:8080
          test-auth-credential: ${{ secrets.TEST_AUTH_CREDENTIAL }}
          test-auth-email: ${{ secrets.TEST_AUTH_EMAIL }}
          # VARIABLES, not secrets: selectors and a URL substring, and a masked one
          # is unreadable in a failure message. Empty keeps the windowed answer (#320)
          # and S2 reading the gate clearing as success (#379).
          test-auth-ready-selector: ${{ vars.TEST_AUTH_READY_SELECTOR }}
          test-auth-ready-request: ${{ vars.TEST_AUTH_READY_REQUEST }}
          test-auth-success-selector: ${{ vars.TEST_AUTH_SUCCESS_SELECTOR }}
          artifact-name: playwright-results-local
          app-pages: ${{ vars.APP_PAGES }}
          start-local-server: 'true'
          server-root: ${{ steps.site.outputs.root }}
          # advisory-run defaults to false: blocking is the default posture for
          # the static/no-backend tier, where the suite runs fully against the
          # bundled local server. A default of true would hand every project a
          # UI suite whose failures show green. Auth/backend-gated scenarios
          # self-skip when no credential is available (TEST_AUTH_CREDENTIAL
          # empty and the login form ships none), and qa-live stays the live gate.
          advisory-run: ${{ inputs.advisory-run }}
