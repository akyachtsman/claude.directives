# Copy to .github/actions/ui-suite/action.yml in your project (the qa
# workflows reference it as `uses: ./.github/actions/ui-suite`).
#
# Caveats baked into this design:
# - Composite steps cannot carry per-step `timeout-minutes` — bound the run with
#   the CALLING job's `timeout-minutes`. The qa workflows set 120, sized from a
#   cold-cache install at 21m25s plus a warm whole job — and the warm figure is a
#   RANGE, not the single 16.6min this note used to cite: claude.prop 8m00s,
#   apfp.claude 16.2-17.0min, claude.trading 30m35s, a 3.8x spread on nominally
#   similar 4-project suites. Size from the SLOW end, and include a RETRY: with
#   S3's per-test budget now 900s and `retries: 1`, a failing scenario REPLACES
#   its healthy S3 with the ceiling and then retries at it — ~+22min for one
#   profile, ~+44min for two — so the slow end runs ~82min with one failing
#   profile and ~104min with two. That is what took this from 60 to 120; at 60 a
#   healthy slow-end cold run had NO headroom at all. The callers carry the full
#   table, the arithmetic, and what 120 deliberately does not cover. These
#   measure THIS composite's `npm install` path below, not a stricter `npm ci`.
#   That 120 is ENFORCED, not merely documented: check-job-bounds.py rejects any
#   ui-suite caller below it, and templates/workflows/qa.yml invokes the guard in
#   its static-checks job. If you copied this composite, copy
#   templates/scripts/check-job-bounds.py to .github/scripts/ and keep that step,
#   or the 120 reverts to being a number in a comment — which is what it was until
#   #291, and what let three callers sit at 40.
#   The browser install is NOT the whole cost, whatever an earlier version of
#   this note said: those warm figures are the suite's own share, and each scales
#   with the number of projects in playwright.config.js. That is also the best
#   available explanation of the 3.8x spread — same project count, very different
#   apps — so read the range as "your repo sits somewhere in here", not as noise
#   around a mean. Raise the CALLERS before adding projects, never after.
#   If you lower it, measure the cold path first — and note a kill during install
#   also skips the cache save that would have made the next run cheap, so too
#   tight costs a streak rather than a run.
# - `advisory-run` flips ONLY the Playwright run step to continue-on-error;
#   setup/install/server/upload always stay blocking, so a broken install can
#   never pass green.
name: 'UI test suite'
description: >
  Install deps + Playwright, optionally start a bundled local server, run the
  suite, upload results. Single source of truth for the run block shared by
  qa.yml, qa-live.yml and qa-response.yml.
inputs:
  tests-dir:
    description: 'Directory containing playwright.config.js and package.json'
    required: true
  app-url:
    description: 'URL the suite targets (local server or live deploy)'
    required: true
  test-auth-credential:
    description: 'Seeded test credential; empty makes auth tests self-skip'
    required: false
    default: ''
  artifact-name:
    description: 'Name for the uploaded results artifact'
    required: true
  start-local-server:
    description: "Set 'true' to serve server-root on :8080 via the bundled http-server"
    required: false
    default: 'false'
  server-root:
    description: 'Directory the local server serves'
    required: false
    default: '.'
  app-pages:
    description: >
      Comma-separated extra HTML entry points (beyond the app root) that the
      ENTRY scenario load-gates, e.g. 'admin.html,vendor/console.html'. Empty
      means the app ships a single page. test.md makes a deployed page with zero
      tests a release blocker, so leaving this empty is a claim, not a default.
    required: false
    default: ''
  advisory-run:
    description: "Set 'true' to make ONLY the run step advisory; setup/install/server/upload stay blocking."
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        # Requires a committed package-lock.json at this path — generate it
        # once (`npm install` in tests-dir) and COMMIT it.
        cache-dependency-path: ${{ inputs.tests-dir }}/package-lock.json

    - name: Install test dependencies
      shell: bash
      run: npm install
      working-directory: ${{ inputs.tests-dir }}

    # Browsers are ~400MB and were re-downloaded on EVERY run. This is a BUDGET
    # fix, not a hang fix, and the distinction was measured rather than assumed:
    # downstream the install step SUCCEEDED in 21m25s, and the job then hit its
    # 30-minute ceiling during the tests. Nothing was stuck; the setup simply ate
    # the budget the tests needed (apfp.claude, 2026-08-19, run 32267163505).
    # Caching removes a 21-minute step from a 30-minute job, which is decisive
    # rather than probabilistic.
    #
    # ⚠️ Actions caches are scoped to the branch that SAVED them, so the first run
    # on a new default branch still misses even when a PR branch populated one.
    # Expect one more slow run after adopting this, then hits.
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.tests-dir)) }}

    - name: Install Playwright browsers
      # Both browsers: playwright.config.js defines a webkit project (iPhone 12)
      # alongside chromium (Pixel 5). Installing chromium alone fails that project.
      # On a cache hit the binaries are already present, so only the SYSTEM
      # libraries need installing — those live in /usr/lib and are never cached.
      #
      # ⚠️ "only the system libraries" is NOT the same as "cheap", and reading it
      # that way has already cost a downstream repo a broken run. Chromium's deps
      # are largely preinstalled on the runner image, so `install-deps chromium`
      # finishes in ~30s and invites the conclusion that the step is incidental.
      # Webkit's are not: gstreamer, wayland, hyphen, enchant and flite come to
      # roughly sixty packages.
      #
      # THE MAGNITUDE IS DISPUTED AND BOTH MEASUREMENTS ARE DATED, because runner
      # images change and an undated figure gets read as current:
      #   2026-08-19  apfp.claude     "minutes, not seconds" for webkit's deps
      #   2026-08-23  claude.trading  ~52s and ~56s for Node + npm install +
      #                               cache restore + install-deps BOTH browsers
      #                               + server start, i.e. this step was well
      #                               under a minute on that image, warm path
      # Both may be true of their own day. Treat neither as the current cost.
      #
      # THE SAFETY ADVICE BELOW SURVIVES EITHER FIGURE — only the magnitude is in
      # question, so do not delete it while correcting a number. Do NOT bound this
      # step on the chromium figure, and do NOT make it warn-and-continue — a
      # partial install does not fail here, it fails later as every webkit test
      # dying on a missing `libwayland-server.so.0`, which turns one clear
      # message into fifty confusing ones.
      shell: bash
      run: |
        if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium webkit
        else
          npx playwright install --with-deps chromium webkit
        fi
      working-directory: ${{ inputs.tests-dir }}

    # http-server is a pinned devDependency installed in tests-dir. Invoke its
    # binary by path while staying at the repo root, so server-root still serves
    # the app root AND nothing is fetched at runtime (works under locked egress).
    - name: Start local server
      if: ${{ inputs.start-local-server == 'true' }}
      shell: bash
      env:
        TESTS_DIR: ${{ inputs.tests-dir }}
        SERVER_ROOT: ${{ inputs.server-root }}
      run: |
        "./$TESTS_DIR/node_modules/.bin/http-server" "$SERVER_ROOT" -p 8080 --silent &
        sleep 2

    - name: Run Playwright tests
      shell: bash
      continue-on-error: ${{ inputs.advisory-run == 'true' }}
      env:
        APP_URL: ${{ inputs.app-url }}
        TEST_AUTH_CREDENTIAL: ${{ inputs.test-auth-credential }}
        APP_PAGES: ${{ inputs.app-pages }}
      # No --reporter flag: a CLI reporter REPLACES the config's list, which
      # would drop the json reporter and leave playwright-results.json unwritten
      # while the upload step below still claims to publish it.
      run: npx playwright test
      working-directory: ${{ inputs.tests-dir }}

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          .agent-reports/screenshots/
          .agent-reports/playwright-results.json
        retention-days: 7
