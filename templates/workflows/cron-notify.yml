# cron-notify.yml — a scheduled job that runs the project's own task,
# .github/scripts/notify-task.js, which emails through notify-email.js. A
# CALLER: copy it to .github/workflows/cron-notify.yml. The job runs in
# claude.directives' .github/workflows/shared-cron-notify.yml at the release
# pinned below, which stages notify-email.js and its package.json beside the
# task and installs their dependency, so the project carries only the task.
# Pins, releases and what a project keeps: docs/standards/cicd-setup.md ->
# Callers and pins.
#
# Installed only when the project has a scheduled task (not by /new-repo;
# docs/standards/cicd-setup.md Step 9f): a `schedule:` trigger starts recurring
# work the moment it lands. The starter notify-task.js guards on the SMTP
# config and emits a GitHub Actions notice if it's missing (needed only if the
# project sends email); replace its body with your task. Setup:
# docs/guides/cron-email-notifications.md.
#
# The task's environment: only the names shared-cron-notify.yml passes reach
# it, the email transport below (variables ALERT_TO, ALERT_FROM, SMTP_HOST,
# SMTP_PORT, SMTP_USER; secret SMTP_PASS) and the backend pair data.md names
# (variable DB_URL, secret DB_SERVICE_KEY). Pass each secret by name.

name: Scheduled Notification

on:
  schedule:
    # GitHub cron is UTC-only and best-effort (can run several minutes late).
    # For a fixed LOCAL time across DST, use TWO entries bracketing the offset
    # plus a time-guard in the script (see the docs "DST-safe scheduling").
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass any in-script time guard (manual run)'
        required: false
        default: 'false'

# Least privilege: the job only reads the repo; email goes out via SMTP secrets.
permissions:
  contents: read

jobs:
  run:
    uses: akyachtsman/claude.directives/.github/workflows/shared-cron-notify.yml@v1
    with:
      force: ${{ inputs.force == 'true' }}
    secrets:
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      # DB_SERVICE_KEY: ${{ secrets.DB_SERVICE_KEY }}   # only if the task reads it
