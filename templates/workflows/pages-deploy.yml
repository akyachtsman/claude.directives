# pages-deploy.yml — the GitHub Pages deploy for a project whose Pages source is
# "GitHub Actions": build (optional) -> filter -> publish -> assert. A CALLER:
# copy it to .github/workflows/pages-deploy.yml. The deploy runs in
# claude.directives' .github/workflows/shared-pages-deploy.yml at the release
# pinned below; every rule of the build, the filter, the retry and the live
# assert is in that file's header. Pins, releases and what a project keeps:
# docs/standards/cicd-setup.md -> Callers and pins.
#
# ACTIONS-SOURCE ONLY: global.md -> Hosting & Deployment (a repo holding any
# file that must not be public, or a project that has taken the CI-build
# opt-in, which forces Actions-source). A BRANCH-SOURCE project does NOT
# install this file: there the push is the deploy and GitHub runs the managed
# pages-build-deployment.
#
# Install, in the same change:
#   1. Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
#   2. Set build-cmd and site-dir below: the build recorded on the `Build:`
#      bullet in the project CLAUDE.md, run from the repo root, and the
#      directory it writes. No build: build-cmd empty and site-dir `.`.
#   3. Declare every path that must not be public in .github/pages-deny.txt
#      (one site-relative path per line; `#` comments and blank lines ignored).
#      Each one is left out of the published copy AND asserted 404 on the live
#      site after the deploy. Internal-looking paths that must stay public go
#      in .github/pages-public.txt, asserted 200.
#   4. The watcher: add this workflow's exact `name:` ("Pages Deploy") to
#      qa-live.yml's watch list — ADD, never replace (W2). Rename it and the
#      watcher follows. A dropped trigger fails nothing, the live gate simply
#      stops firing.
# Installed before the first page exists (a new project), it publishes nothing
# until index.html arrives: with no build and no Pages deployment ever, a run
# skips its Publish job and qa-live.yml skips its suite.
# In this workflow's runs the jobs read "deploy / Build and filter",
# "deploy / Publish" and "deploy / Assert the live site".
# Rules and reasoning: docs/standards/automations.md -> Watcher Rules (W2),
# docs/standards/hosting-mechanics.md.

name: Pages Deploy

on:
  push:
    branches: [main]
  # Stuck-run recovery re-dispatches this workflow (update-pages step 5). Never
  # recover an Actions-source site by switching to "Deploy from a branch": that
  # publishes the whole repository, unfiltered and unbuilt.
  workflow_dispatch:

# A called workflow can only narrow the caller's token, so this grants the most
# any of its jobs needs: deployments: read for the build job's bootstrap
# lookup, pages: write and id-token: write for the publish.
permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

# One deploy at a time. A RUNNING deploy is never cancelled: cancelling a
# publish mid-flight can leave the previous deployment live with no failure
# reported. A PENDING one is: the group holds one waiting run, and a newer push
# replaces it (conclusion `cancelled`), so the newest main is what deploys. A
# watcher reading conclusions must treat a cancelled run with a newer run of
# this workflow behind it as superseded, not as a failed deploy.
# Only main shares the group. A run on any other ref (a manual dispatch with
# --ref) gets a group of its own, so it can never take the pending slot from a
# main run before the build job's "Only main deploys" step rejects it.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages-deploy' || format('pages-deploy-offmain-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: akyachtsman/claude.directives/.github/workflows/shared-pages-deploy.yml@v1
    with:
      build-cmd: ''
      site-dir: '.'
