name: Pages Monitor
# Zero-model GitHub Pages deploy monitor. Fires on every Pages deploy,
# verifies the deploy is healthy and the live URL is serving, and on a problem
# opens/updates a single deduplicated tracking issue (which notifies the owner).
# Success is reported in the job summary only — no inbox noise. Uses only
# GITHUB_TOKEN — no external services. workflow_dispatch allows a manual liveness
# re-check. The live URL comes from the Pages API (so user-site repos and custom
# domains work), with a generic derivation as fallback — portable as-is.
#
# ⚠️ RULE W2 — `page_build` fires only for the MANAGED branch build. If your
# Pages source is "GitHub Actions" it never fires and this monitor never runs.
# ACTION: add a workflow_run trigger naming your own deploy workflow:
#
#   workflow_run:
#     workflows: ['<your deploy workflow name>']
#     types: [completed]
#
# The job below already handles that event — it normalises the two status
# vocabularies. Do not pre-fill a guessed name.
# Why: docs/standards/automations.md -> Watcher Rules (W2, W3 — a monitor may watch either source; a retry may not).
#
# ⚠️ EXPOSURE (optional) — a rogue unfiltered republish (the visibility-flip
# legacy build, global.md -> Hosting & Deployment) serves the app as 200, so
# build status + liveness alone pass it. Declare your forbidden paths in
# `.github/pages-deny.txt` — one site-relative path per line, `#` comments and
# blank lines ignored — and every run asserts each serves 404 on the LIVE site,
# whoever published it; a late legacy build fires its own run. A path must be
# 404 on two probes 30s apart (one 404 can be the PREVIOUS deploy mid-CDN
# propagation), with redirects NOT followed — a 3xx to a page that 404s is the
# declared URL answering something other than 404, so it is reported. Paths are
# taken literally (percent-encoded, no curl globbing). A DIRECTORY entry is
# expanded to every file under it in the repository at the deployed commit, and
# each is probed: a directory URL can 404 while a file under it is served. (That
# is the source tree; a build that writes denied files the source lacks is
# covered by pages-deploy.yml's own check, not here.) At most 40 URLs after
# expansion, the same cap as pages-deploy.yml — more is reported, not silently
# truncated, since the job bound cannot fit them. Absent file, or one listing no paths =
# nothing declared = no-op, and the job summary says exposure was NOT checked.
# LIMIT: this checks the paths you REMEMBERED to list. A new internal directory
# nobody adds is invisible — the deploy's deny-list problem, one layer out.
on:
  page_build:
  workflow_dispatch:

# ⚠️ RACE FIX. Two Pages deploys completing close together previously launched
# independent monitors with no ordering, each mutating the same
# `pages-deploy-failure` issue from its own event. The liveness check retries for
# up to ~135s, so an OLDER run still inside that loop could `gh issue reopen`
# after a NEWER successful run had already closed it — a red alarm on a healthy
# site, and one that reads as a real outage. Serialising on a single group with
# cancel-in-progress removes the race rather than narrowing it: the newest deploy
# is the one whose liveness matters, and it probes the same URL the cancelled run
# was probing, so nothing is lost by cancelling. Pre-dates the workflow_run
# trigger — two `page_build` events could always collide; adding the second
# source made it likelier, not possible.
# (Confirmed downstream on apfp.claude, 2026-08-19.)
concurrency:
  group: pages-monitor
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pages: read   # lets the Pages API return the real html_url
  actions: read # lists the watched workflow's runs, to tell a superseded cancel from a failed deploy

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Liveness up to ~165s, a 30s pause, and two 8s probes for each of up to 40
    # forbidden URLs (~11 min).
    timeout-minutes: 20
    steps:
      - name: Verify Pages deploy and report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BUILD_STATUS: ${{ github.event.build.status }}
          BUILD_ERROR: ${{ github.event.build.error.message }}
          BUILD_COMMIT: ${{ github.event.build.commit }}
          # Actions-sourced deploys populate these instead; both sets are empty
          # on workflow_dispatch, which the "manual" default below covers.
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RUN_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_LABEL: 'pages-deploy-failure'
        run: |
          set -euo pipefail
          # Real Pages URL from the API (covers <owner>.github.io user-site
          # repos and custom domains); generic derivation as the fallback.
          url=$(gh api "repos/$REPO/pages" --jq '.html_url // empty' 2>/dev/null || true)
          if [ -z "$url" ]; then
            repo_name="${REPO#*/}"
            url="https://${OWNER}.github.io/${repo_name}/"
          fi
          case "$url" in */) ;; *) url="${url}/" ;; esac
          # Normalise the two event vocabularies to one. page_build reports
          # built/errored; a workflow_run reports success/failure. Mapping here
          # keeps the single decision below unchanged — and note a non-success
          # conclusion includes 'cancelled' and 'timed_out', which leave the site
          # on its previous build just as surely as a failure does.
          status="${BUILD_STATUS:-}"
          commit="${BUILD_COMMIT:-}"
          if [ -z "$status" ] && [ -n "${RUN_CONCLUSION:-}" ]; then
            case "$RUN_CONCLUSION" in
              success) status="built" ;;
              *)       status="errored" ;;
            esac
            commit="${RUN_COMMIT:-}"
          fi
          status="${status:-manual}"
          # NOT A DEPLOY OF THE SITE. A watched deploy run on another branch (a
          # manual dispatch with --ref, which pages-deploy.yml refuses) published
          # nothing, so its conclusion says nothing about the live site.
          if [ -n "${RUN_CONCLUSION:-}" ] && [ -n "${RUN_BRANCH:-}" ] && [ -n "${DEFAULT_BRANCH:-}" ] \
             && [ "$RUN_BRANCH" != "$DEFAULT_BRANCH" ]; then
            {
              echo "## ⏭️ Not a deploy of ${DEFAULT_BRANCH}"
              echo ""
              echo "- The watched run was on ${RUN_BRANCH}; only ${DEFAULT_BRANCH} publishes the site."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # SUPERSEDED is not a failure. A deploy whose concurrency group holds
          # one pending run (pages-deploy.yml) cancels that run when a newer
          # push arrives, so a cancelled run with a NEWER run of the same
          # workflow behind it was replaced, not broken: the newer run gets its
          # own monitor run. Anything else cancelled, or a lookup that fails,
          # stays errored.
          if [ "${RUN_CONCLUSION:-}" = "cancelled" ] && [ -n "${RUN_WORKFLOW_ID:-}" ] && [ -n "${RUN_NUMBER:-}" ]; then
            newest=$(gh api "repos/$REPO/actions/workflows/$RUN_WORKFLOW_ID/runs?per_page=5" \
              --jq '[.workflow_runs[].run_number] | max // 0' 2>/dev/null) || newest=0
            if [ "${newest:-0}" -gt "$RUN_NUMBER" ] 2>/dev/null; then
              {
                echo "## ⏭️ Pages deploy superseded"
                echo ""
                echo "- Run #${RUN_NUMBER} was cancelled for newer run #${newest}; that run is monitored on its own."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          short="${commit:0:7}"
          echo "Pages deploy status: $status (commit ${short:-n/a}) — target $url"

          problems=""

          # 1) Build status straight from the event (authoritative).
          if [ "$status" = "errored" ]; then
            problems="${problems}- Pages build **errored**: ${BUILD_ERROR:-no message provided}\n"
          fi

          # 2) Liveness: the live URL must return 200 (cache-busted, with retries
          #    so we wait out CDN propagation rather than false-alarming).
          # A failed curl still prints 000 through -w, so the fallback REPLACES
          # the captured code; appending one (`|| echo 000`) reported "000000".
          code="000"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${url}?cb=${GITHUB_RUN_ID}-${attempt}") || code="000"
            [ "$code" = "200" ] && break
            sleep $((attempt * 6))
          done
          if [ "$code" != "200" ]; then
            problems="${problems}- Live site did not return 200 at ${url} (last HTTP ${code})\n"
          fi

          # 3) Exposure: each path in .github/pages-deny.txt must serve 404 (see
          #    the ⚠️ EXPOSURE header). Only a 404 from the API means "no file";
          #    any other read failure is a problem, never a silent no-op.
          deny_note="none declared (no .github/pages-deny.txt) — exposure NOT checked"
          deny_err=$(mktemp)
          if [ "$code" != "200" ]; then
            problems="${problems}- Forbidden paths NOT checked: the site itself is not serving\n"
          elif deny=$(gh api -H "Accept: application/vnd.github.raw+json" \
                "repos/$REPO/contents/.github/pages-deny.txt" 2>"$deny_err"); then
            # Parse first, probe second: two PASSES with one delay between them,
            # so a path counts only if it is 404 on both. A single 404 can come
            # from the PREVIOUS deployment while the CDN propagates, and the
            # root check cannot see that (the old deploy already served 200).
            # The list is capped so the worst case (every probe hitting its
            # --max-time) stays inside timeout-minutes:
            # 165s liveness + 30s delay + 40 URLs x 2 passes x 8s = ~835s < 1200s.
            entries=()
            while IFS= read -r p || [ -n "$p" ]; do
              p="${p#"${p%%[![:space:]]*}"}"; p="${p%"${p##*[![:space:]]}"}"
              case "$p" in ''|'#'*) continue ;; esac
              entries+=("${p#/}")
            done <<< "$deny"
            # Expand a directory entry to every file under it in the repository
            # at the deployed commit (the default branch on a manual run).
            paths=()
            if [ "${#entries[@]}" -gt 0 ]; then
              tree_err=$(mktemp)
              if tree=$(gh api "repos/$REPO/git/trees/${commit:-HEAD}?recursive=1" \
                    --jq 'if .truncated then "::TRUNCATED::" else (.tree[] | select(.type == "blob") | .path) end' 2>"$tree_err") \
                 && [ "$tree" != "::TRUNCATED::" ]; then
                for e in "${entries[@]}"; do
                  paths+=("$e")
                  d="${e%/}"
                  while IFS= read -r f; do
                    case "$f" in "$d"/*) paths+=("$f") ;; esac
                  done <<< "$tree"
                done
              else
                [ "${tree:-}" = "::TRUNCATED::" ] && echo "the tree listing was truncated" > "$tree_err"
                problems="${problems}- Could not list the repository tree to expand denied directories, so files under them are NOT checked: $(head -c 200 "$tree_err" | tr '\n' ' ')\n"
                paths=("${entries[@]}")
              fi
            fi
            # One URL per path: overlapping entries (`private/` and
            # `private/a.json`) must not count twice against the cap, as in
            # pages-deploy.yml, which dedupes the same way.
            if [ "${#paths[@]}" -gt 0 ]; then
              mapfile -t paths < <(printf '%s\n' "${paths[@]}" | sort -u)
            fi
            n=${#paths[@]}
            max_paths=40
            # Percent-encode each segment: a literal `#` or `?` in a name would
            # otherwise start a fragment or query and probe another URL.
            enc() { python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$1"; }
            if [ "$n" -eq 0 ]; then
              deny_note=".github/pages-deny.txt lists no paths — exposure NOT checked"
            elif [ "$n" -gt "$max_paths" ]; then
              problems="${problems}- .github/pages-deny.txt expands to ${n} URLs; the monitor checks at most ${max_paths} within its time bound — exposure NOT checked\n"
            else
              first=()
              for i in "${!paths[@]}"; do
                first[i]=$(curl -sg -o /dev/null -w "%{http_code}" --max-time 8 "${url}$(enc "${paths[i]}")?cb=${GITHUB_RUN_ID}-d1") || first[i]="000"
              done
              sleep 30
              for i in "${!paths[@]}"; do
                dcode=$(curl -sg -o /dev/null -w "%{http_code}" --max-time 8 "${url}$(enc "${paths[i]}")?cb=${GITHUB_RUN_ID}-d2") || dcode="000"
                if [ "${first[i]}" != "404" ] || [ "$dcode" != "404" ]; then
                  problems="${problems}- Forbidden path served HTTP ${first[i]} then ${dcode}, expected 404 on both: ${url}${paths[i]}\n"
                fi
              done
              deny_note="${#entries[@]} declared in .github/pages-deny.txt (${n} URLs after expanding directories), all 404 on two probes 30s apart"
            fi
          elif grep -q 'HTTP 404' "$deny_err"; then
            :
          else
            problems="${problems}- Could not read .github/pages-deny.txt: $(head -c 200 "$deny_err" | tr '\n' ' ')\n"
          fi

          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ -n "$problems" ]; then
            body=$(printf 'Pages deploy problem(s) detected at %s for commit `%s`:\n\n%b\nLive URL: %s' "$stamp" "${short:-n/a}" "$problems" "$url")
            gh label create "$ISSUE_LABEL" --repo "$REPO" --color B60205 \
              --description "Open GitHub Pages deploy failure tracked by Pages Monitor" 2>/dev/null || true
            existing=$(gh issue list --repo "$REPO" --state all --label "$ISSUE_LABEL" \
              --json number,state --jq 'sort_by(.number) | last // empty')
            num=$(echo "$existing" | jq -r '.number // empty')
            state=$(echo "$existing" | jq -r '(.state // "") | ascii_downcase')
            if [ -n "$num" ]; then
              [ "$state" = "closed" ] && gh issue reopen "$num" --repo "$REPO"
              gh issue comment "$num" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" \
                --title "Pages deploy failing" \
                --label "$ISSUE_LABEL" \
                --body "$(printf '%s\n\n---\nAuto-managed by \`.github/workflows/pages-monitor.yml\`. It closes automatically on the next healthy deploy.' "$body")"
            fi
            {
              echo "## ❌ Pages deploy problem"
              echo ""
              printf '%b\n' "$problems"
              echo "Live URL: $url"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Healthy: close any open tracking issue, report green in the summary.
          open_num=$(gh issue list --repo "$REPO" --state open --label "$ISSUE_LABEL" \
            --json number --jq 'sort_by(.number) | last | .number // empty' || true)
          if [ -n "${open_num:-}" ]; then
            gh issue comment "$open_num" --repo "$REPO" \
              --body "Pages deploy healthy again at $stamp (commit ${short:-n/a}). Closing." || true
            gh issue close "$open_num" --repo "$REPO" || true
          fi
          {
            echo "## ✅ Pages deploy live"
            echo ""
            echo "- Commit: \`${short:-n/a}\`"
            echo "- URL: $url"
            echo "- Verified: HTTP 200"
            echo "- Forbidden paths: ${deny_note}"
          } >> "$GITHUB_STEP_SUMMARY"
