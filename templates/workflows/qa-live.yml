# qa-live.yml — Playwright against the live deployed URL.
# Copy to .github/workflows/qa-live.yml in your project, along with the
# ui-suite composite from templates/actions/ into .github/actions/.
# Triggers automatically after GitHub Pages deploys, or manually via workflow_dispatch.
#
# ⚠️ RULE W2 — Pages has two sources and only one name is ours to pre-fill.
# ACTION: if Settings -> Pages -> Source is "GitHub Actions", add your own deploy
# workflow's exact `name:` to the list below. Do not invent one.
# ACTION: the job's `if:` gate needs NO workflow-name condition — it reads
# workflow_run.conclusion, which is agnostic to which workflow fired it.
# Why: docs/standards/automations.md -> Watcher Rules (W2).
#
# The job's `if:` gate below needs NO workflow-name condition — it reads
# `github.event.workflow_run.conclusion`, which is agnostic to which workflow
# fired it. Do not "helpfully" add one; that re-breaks exactly what this fixes.
#
# Required setup:
#   - Add TEST_AUTH_CREDENTIAL as a repository secret — skip if the project has
#     (email+password AND identifier-first/split-step gates need TEST_AUTH_EMAIL
#      as well — directives#304, #310; without it a split-step gate is not even
#      DETECTED and the authenticated scenarios run against the identifier screen)
#     no auth; the empty secret makes auth tests self-skip
#   - Add APP_URL as a repository variable: Settings → Secrets and variables → Variables
#     e.g. https://<your-username>.github.io/<your-repo>/
#   - Set UI_TESTS_DIR below to the path of your Playwright test directory
#
# Note: the ui-suite composite cannot carry per-step timeout-minutes (the old
# 8/12-minute sub-timeouts are gone); the job-level timeout-minutes below still
# bounds the whole run.

name: QA — UI Tests (live)

on:
  workflow_run:
    # + your Actions deploy workflow's `name:` if that is your Pages source
    workflows: ['pages-build-deployment']
    types: [completed]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Override live app URL (optional)'
        required: false

# Only one live run per ref at a time; a newer trigger cancels the older/queued
# one. Without this, repeated Pages deploys queue up qa-live runs that can sit
# for hours (the job timeout below does not start counting until a runner is
# assigned, so a queued run is not bounded by it).
concurrency:
  group: qa-live-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the repo and run tests against the live URL.
permissions:
  contents: read

env:
  UI_TESTS_DIR: .github/scripts/ui-tests

jobs:
  ui-tests-live:
    # For workflow_run: only run when Pages deploy succeeded.
    # For workflow_dispatch: always run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 120 is the fleet FLOOR for a ui-suite caller — UI_SUITE_FLOOR in check-job-bounds.py,
    # which enforces it. Set HIGHER if your suite needs it, never lower, and raise it BEFORE
    # adding projects. Why 120 (measurements, arithmetic, what it does NOT cover): the
    # CALLER BOUND section of .github/actions/ui-suite/action.yml's header.
    timeout-minutes: 120

    steps:
      # Fail in seconds, not after a cold install: with no URL the config falls
      # back to its placeholder and every scenario fails on an invalid address
      # (audit, 2026-10-06; qa-response.yml carries the same guard).
      - name: Require APP_URL
        env:
          URL: ${{ github.event.inputs.app_url || vars.APP_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::APP_URL repository variable is not set, and no app_url input was given — cannot run the live suite."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Blocking — this is the authoritative live UI gate.
      - uses: ./.github/actions/ui-suite
        with:
          tests-dir: ${{ env.UI_TESTS_DIR }}
          # workflow_dispatch input overrides repo variable if provided
          app-url: ${{ github.event.inputs.app_url || vars.APP_URL }}
          test-auth-credential: ${{ secrets.TEST_AUTH_CREDENTIAL }}
          test-auth-email: ${{ secrets.TEST_AUTH_EMAIL }}
          # VARIABLES, not secrets: selectors and a URL substring, and a masked one
          # is unreadable in a failure message. Empty keeps the windowed answer (#320)
          # and S2 reading the gate clearing as success (#379).
          test-auth-ready-selector: ${{ vars.TEST_AUTH_READY_SELECTOR }}
          test-auth-ready-request: ${{ vars.TEST_AUTH_READY_REQUEST }}
          test-auth-success-selector: ${{ vars.TEST_AUTH_SUCCESS_SELECTOR }}
          artifact-name: playwright-results-live
          app-pages: ${{ vars.APP_PAGES }}
