# qa-live.yml — Playwright against the live deployed URL.
# Copy to .github/workflows/qa-live.yml in your project, along with the
# ui-suite composite from templates/actions/ into .github/actions/.
# Triggers automatically after GitHub Pages deploys, or manually via workflow_dispatch.
#
# ⚠️ RULE W2 — Pages has two sources and only one name is ours to pre-fill.
# ACTION: if Settings -> Pages -> Source is "GitHub Actions", add your own deploy
# workflow's exact `name:` to the list below. Do not invent one.
# ACTION: on the PRODUCTION tier (Vercel), neither name applies — the deploy
# happens off-Actions entirely. The deployment_status trigger covers that tier;
# leave it in place even on a static-tier repo, where nothing posts one.
# NOTE: Vercel now also offers repository_dispatch with a richer payload and is
# steering integrations toward it. deployment_status is used here because it
# needs no Vercel-side configuration; switch if you want the fuller payload.
# ACTION: the job's `if:` gate needs NO workflow-name condition — it reads
# workflow_run.conclusion, which is agnostic to which workflow fired it.
# Why: docs/standards/automations.md -> Watcher Rules (W2).
#
# The job's `if:` gate below needs NO workflow-name condition — it reads
# `github.event.workflow_run.conclusion`, which is agnostic to which workflow
# fired it. Do not "helpfully" add one; that re-breaks exactly what this fixes.
#
# Required setup:
#   - Add TEST_AUTH_CREDENTIAL as a repository secret — skip if the project has
#     no auth; the empty secret makes auth tests self-skip
#   - Add APP_URL as a repository variable: Settings → Secrets and variables → Variables
#     e.g. https://<your-username>.github.io/<your-repo>/
#   - Set UI_TESTS_DIR below to the path of your Playwright test directory
#
# Note: the ui-suite composite cannot carry per-step timeout-minutes (the old
# 8/12-minute sub-timeouts are gone); the job-level timeout-minutes below still
# bounds the whole run.

name: QA — UI Tests (live)

on:
  workflow_run:
    # + your Actions deploy workflow's `name:` if that is your Pages source
    workflows: ['pages-build-deployment']
    types: [completed]
  # Production tier (Vercel/Next): a Vercel deploy fires no workflow_run in this
  # repo, so the workflow_run trigger above covers the STATIC tier only and the
  # authoritative live gate auto-fired on one tier while the other relied on
  # someone remembering to dispatch it. Vercel posts a deployment_status, which
  # is the event that closes that gap. Harmless on a static-tier repo: nothing
  # posts one, so it simply never fires.
  deployment_status:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Override live app URL (optional)'
        required: false

# Only one live run per ref at a time; a newer trigger cancels the older/queued
# one. Without this, repeated Pages deploys queue up qa-live runs that can sit
# for hours (the job timeout below does not start counting until a runner is
# assigned, so a queued run is not bounded by it).
concurrency:
  # deployment_status runs all share ONE group: each preview ref would otherwise
  # get its own, so N open PRs could run N concurrent 40-minute suites against
  # the same production APP_URL. Per-ref grouping is still right for the
  # push/dispatch paths, where the ref is what distinguishes the run.
  group: qa-live-${{ github.event_name == 'deployment_status' && 'deployments' || github.ref }}
  cancel-in-progress: true

# Least privilege: read the repo and run tests against the live URL.
permissions:
  contents: read

env:
  UI_TESTS_DIR: .github/scripts/ui-tests

jobs:
  ui-tests-live:
    # Each trigger reports success in its own field, and the other fields are
    # empty for a given event — so all three conditions must be spelled out.
    # workflow_run  -> workflow_run.conclusion == 'success'  (Pages build)
    # deployment_status -> deployment_status.state == 'success'  (Vercel)
    # workflow_dispatch -> always run.
    # Deliberately NOT filtered on deployment.environment: the exact value Vercel
    # sends on deployment_status is not something this template can guarantee, and
    # an equality that never matches would give you a live gate that silently
    # never fires — the failure this trigger exists to fix. A preview deploy
    # therefore also fires a run, against APP_URL (production); concurrency above
    # cancels the older one. Once you have confirmed the value your project
    # actually receives, tighten this with an environment condition.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    # ⚠️ 40, NOT 20. This job runs ui-suite, whose COLD-cache path is
    # `playwright install --with-deps chromium webkit` — measured at 21m25s
    # (apfp.claude, run 32267163505). A 20-minute bound therefore killed every
    # cold run before the tests began, and because `actions/cache` saves at job
    # END the kill also skipped the save, leaving the next run equally cold. A
    # bound below the work it bounds does not protect anything; it fails on a
    # schedule. Warm runs finish in ~5 minutes, so this ceiling only ever applies
    # to the cold path it exists to survive.
    timeout-minutes: 40

    steps:
      # SECURITY: a deployment_status fires for PREVIEW deploys too, on the
      # contributor's ref. Checking that ref out would run their copy of the
      # ui-suite composite and the Playwright specs with TEST_AUTH_CREDENTIAL in
      # the environment — an exfiltration path for anyone who can open a PR. The
      # suite always targets APP_URL (production), so the branch under test is
      # irrelevant: pin the harness to the default branch and the secret is only
      # ever handed to reviewed code. The other triggers keep default checkout
      # behaviour, where the ref IS the thing being tested.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.repository.default_branch || '' }}

      # Blocking — this is the authoritative live UI gate.
      - uses: ./.github/actions/ui-suite
        with:
          tests-dir: ${{ env.UI_TESTS_DIR }}
          # workflow_dispatch input overrides repo variable if provided
          app-url: ${{ github.event.inputs.app_url || vars.APP_URL }}
          test-auth-credential: ${{ secrets.TEST_AUTH_CREDENTIAL }}
          artifact-name: playwright-results-live
          app-pages: ${{ vars.APP_PAGES }}
