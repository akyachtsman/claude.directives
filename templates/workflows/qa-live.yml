# qa-live.yml — Playwright against the live deployed URL, after each GitHub
# Pages deploy or by hand. A CALLER: copy it to .github/workflows/qa-live.yml.
# The suite runs in claude.directives' .github/workflows/shared-qa-live.yml at
# the release pinned below. Pins, releases and what a project keeps:
# docs/standards/cicd-setup.md -> Callers and pins.
#
# ⚠️ RULE W2 — Pages has two sources and only one name is ours to pre-fill.
# ACTION: if Settings -> Pages -> Source is "GitHub Actions", add your deploy
# workflow's exact `name:` to the list below: "Pages Deploy" for
# templates/workflows/pages-deploy.yml, else your own. Add, never replace. It is
# not pre-filled because on a branch-source project that name matches nothing.
# Keep it: a dropped arm fails nothing, the live gate simply stops firing
# (cicd-setup.md -> 9c-bis).
# ACTION: the shared job's `if:` gate needs NO workflow-name condition — it
# reads `github.event.workflow_run.conclusion`, which is agnostic to which
# workflow fired it. Why: docs/standards/automations.md -> Watcher Rules (W2).
#
# What to set (every input, with its default: the `inputs:` of
# shared-qa-live.yml):
#   - APP_URL as a repository variable: Settings → Secrets and variables →
#     Variables, e.g. https://<your-username>.github.io/<your-repo>/
#   - tests-dir: the directory holding the project's playwright.config.js.
#   - TEST_AUTH_CREDENTIAL / TEST_AUTH_EMAIL repository secrets: set them only
#     for a login that needs a credential from outside
#     (docs/standards/cicd-setup.md -> Step 5). Pass each by name.
#
# On an Actions-source project the shared run also probes each
# .github/pages-deny.txt path for a 404 after every watched build, the legacy
# pages-build-deployment included (global.md -> Hosting & Deployment); with no
# such file it checks nothing.
#
# No `concurrency` here: the shared suite job carries it (one live run per ref;
# a newer deploy cancels an older one still running). `every-commit: true`
# gives each deployed commit its own run instead.

name: QA — UI Tests (live)

on:
  workflow_run:
    # + 'Pages Deploy' (pages-deploy.yml), or your own deploy's `name:`, on Actions-source
    workflows: ['pages-build-deployment']
    types: [completed]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Override live app URL (optional)'
        required: false

# Least privilege: read the repo and run tests against the live URL.
# `actions: read` is for the shared published lookup, which reads the watched
# deploy's jobs; a called workflow can only narrow the caller's token.
permissions:
  contents: read
  actions: read

jobs:
  live:
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa-live.yml@v1
    with:
      tests-dir: .github/scripts/ui-tests
      # A dispatch input overrides the APP_URL variable when given.
      app-url: ${{ inputs.app_url }}
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}
