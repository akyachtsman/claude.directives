# qa-response.yml — event-driven QA against the live URL, started by a
# repository_dispatch (qa-email-received, test-failure-reported,
# manual-qa-trigger) or by hand. A CALLER: copy it to
# .github/workflows/qa-response.yml. The checks run in claude.directives'
# .github/workflows/shared-qa-response.yml at the release pinned below. Pins,
# releases and what a project keeps: docs/standards/cicd-setup.md -> Callers
# and pins.
#
# Dispatch it from a Claude Code session using the GitHub API:
#   curl -X POST https://api.github.com/repos/<owner>/<repo>/dispatches \
#     -H "Authorization: token <GITHUB_TOKEN>" \
#     -d '{"event_type":"manual-qa-trigger"}'
#
# ⚠️ A repository_dispatch tests the DEFAULT BRANCH's suite against whatever
# APP_URL serves, never the branch a session dispatched from: the full warning
# is in shared-qa-response.yml's header. Use the PR's own qa.yml run for branch
# changes.
#
# What to set (every input, with its default: the `inputs:` of
# shared-qa-response.yml):
#   - APP_URL as a repository variable (the live URL).
#   - tests-dir: the directory holding the project's playwright.config.js.
#   - TEST_AUTH_CREDENTIAL / TEST_AUTH_EMAIL repository secrets: set them only
#     for a login that needs a credential from outside
#     (docs/standards/cicd-setup.md -> Step 5). Pass each by name.

name: QA — Event-Driven Response

on:
  repository_dispatch:
    types:
      - qa-email-received       # triggered when Gmail monitor detects a relevant email
      - test-failure-reported   # triggered when another workflow reports a failure
      - manual-qa-trigger       # triggered manually by an active session

  # Also allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual session trigger'

# Least privilege: read the repo and run tests.
permissions:
  contents: read

jobs:
  respond:
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa-response.yml@v1
    with:
      tests-dir: .github/scripts/ui-tests
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}
