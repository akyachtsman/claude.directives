# qa.yml — Static checks + Playwright against a local server.
# Copy to .github/workflows/qa.yml in your project, along with the composite
# actions from templates/actions/ into .github/actions/ (secret-scan, ui-suite).
#
# Jobs:
#   static-checks — secret scan (composite) + contrast guardrail; the blocking
#                   gate, runs on every trigger.
#   ui-changes    — diffs the PR against its base and decides whether the
#                   browser job is needed. Non-PR events (push to main)
#                   always run UI tests.
#   ui-tests      — Playwright against a local server via the ui-suite
#                   composite. BLOCKING by default for the static/no-backend
#                   tier (the suite runs fully against the bundled http-server);
#                   set advisory-run: 'true' only as an explicit, temporary
#                   opt-out — and flip it back once the blocking issue is fixed.
#
# Required setup:
#   - Add TEST_AUTH_CREDENTIAL as a repository secret — skip if the project has
#     no auth; the empty secret makes auth tests self-skip
#   - Set UI_TESTS_DIR below to the path of your Playwright test directory
#   - Adjust the UI_PATHS regex in the ui-changes job to your project layout

name: QA — Static + UI Tests

on:
  pull_request:
    branches: [main]
  # push covers only main (the post-merge run). Feature-branch commits are
  # covered by the pull_request trigger — listing them here too made every
  # PR commit run the whole workflow twice. Accepted trade-off: commits
  # pushed before a PR exists get no run; the draft-PR-immediately flow
  # makes that window moments.
  push:
    branches: [main]
  # Manual escape hatch: pull_request event delivery can die provider-side
  # (observed 2026-07-19) — this lets a session or the Actions tab run the
  # gate by hand on any ref. A dispatch run on the PR's head SHA satisfies
  # the merge gate. See docs/standards/ci-triage.md → "CI never registered".
  workflow_dispatch:

# Least privilege: these jobs only read the repo and run tests.
permissions:
  contents: read

env:
  # Path to the directory containing playwright.config.js and package.json
  UI_TESTS_DIR: .github/scripts/ui-tests

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Secret scan (composite — single source of truth for the pattern) ────
      - uses: ./.github/actions/secret-scan

      # ── Contrast guardrail ───────────────────────────────────────────────────
      # WCAG AA check against styles/tokens.css (this project's design tokens).
      # Exits with a notice (no failure) until /design-intake creates tokens.css.
      - name: Contrast guardrail (WCAG AA)
        run: node .github/scripts/check-contrast.js


      - name: Workflow cross-reference guard
        # Every `workflow_run.workflows:` entry must name a real workflow. GitHub
        # raises no error when one does not — the watcher simply never fires.
        run: python3 .github/scripts/workflow-ref-guard.py

      - name: Job bounds guard
        # ENFORCED: every job bounded, none >= 360, ui-suite callers >= 60.
        # Without this step the 60 below is a NUMBER IN A COMMENT: an edit back
        # to 40 passes CI and then cancels healthy cold runs, which read as
        # inconclusive rather than red, so nobody chases them.
        # ADVISORY: the direct-`playwright install` floor of 30 prints and never
        # fails the build — identifying a playwright invocation inside a `run:`
        # block means parsing bash, and the heuristic is not sound enough to gate
        # on (rule 3 in the script header). Do not read a green run as proof that
        # floor was met. Scans .github/workflows; it skips templates/workflows,
        # which only claude.directives has, and says so.
        run: python3 .github/scripts/check-job-bounds.py
  ui-changes:
    name: Detect UI-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.diff.outputs.ui }}

    steps:
      - name: Checkout (full history for base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against PR base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Per-project: paths whose changes warrant a browser run. Includes
          # js/ and styles/ (a source-only change must not skip the browser
          # job) and .github/actions/ (changes to the composites are exercised
          # pre-merge).
          # ANY deployed .html is an entry point, nested ones included: APP_PAGES
          # advertises paths like vendor/console.html, and a matcher anchored to
          # root-level files let a PR touching only that page set ui=false and
          # skip the very ENTRY gate the page exists for.
          UI_PATHS: '(\.html$|^js/|^styles/|^\.github/actions/|^\.github/scripts/ui-tests/|^\.github/workflows/qa\.yml$)'
        run: |
          # This job gates the LOCAL suite, which serves the repo root as static
          # files, so it needs a static entry point. Enabling it for a repo with
          # no index.html would hand Playwright a directory listing to assert
          # against — a green run that never loaded an application.
          if [ ! -f index.html ]; then
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No index.html yet — skipping browser job."
            exit 0
          fi
          # Non-PR events (push to main) always run UI tests unconditionally.
          if [ "$EVENT" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — UI tests run unconditionally."
            exit 0
          fi
          # Capture the diff FIRST and fail loudly if git could not produce it.
          # Piping straight into grep hides the failure: `-e` is suspended inside
          # an `if` condition and there is no pipefail here, so an unresolvable
          # BASE_SHA (shallow fetch, force-push, fork PR) makes git error, grep
          # see nothing, and the job report "No UI-relevant changes" — silently
          # skipping the browser tests on a PR that may be entirely UI.
          if ! files=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "::error::could not diff $BASE_SHA...HEAD — refusing to guess whether UI tests are needed."
            exit 1
          fi
          if printf '%s\n' "$files" | grep -qE "$UI_PATHS"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "UI-relevant changes detected."
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No UI-relevant changes — skipping browser job."
          fi

  ui-tests:
    name: UI Tests (local server)
    needs: [static-checks, ui-changes]
    if: needs.ui-changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # 90, NOT 60 (and never 40). This job runs the ui-suite composite: dependency install + playwright
    # install + EVERY project in playwright.config.js + retries + artifact
    # upload, in one sum the composite cannot subdivide.
    #
    # Sized from MEASURED numbers — and the warm figure is a RANGE, not one
    # anchor. An earlier version of this block cited apfp.claude's 16.6min as
    # though it were typical. Four repos have now measured this path:
    #
    #     WARM, whole job, 4-project suites
    #       claude.prop         8m00s    208 tests   cache hit, zero downloads
    #       apfp.claude        16.2-17.0min ~204 specs   three qa-live runs
    #       claude.trading     30m35s    128 tests   run 97234645851
    #
    # That is a 3.8x spread whole-job to whole-job, on nominally similar suites,
    # and test COUNT does not predict it — the slowest repo runs the fewest
    # tests. (#296 quotes 3.7x; that compares claude.trading's 29m34s TEST PHASE
    # against claude.prop's WHOLE JOB. Like for like it is 3.8x.)
    #
    #     cold-cache browser install   21m25s   (claude.directives
    #                                            check-job-bounds.py, rule 3)
    #
    # NOTE the composite installs with `npm install`, not `npm ci` — an earlier
    # version of this block said ci. They differ in resolution and speed, so
    # treat these as measuring THIS path, not a stricter one.
    #     -------------------------------------
    # SIZE FROM THE SLOW END, which is the whole point of carrying a range:
    #     fast end   21m25s + 8m00s   = ~29min  → 60 leaves ~52% headroom
    #     slow end   21m25s + 30m35s  = ~52min  → 60 leaves ~13% headroom
    #
    # claude.trading's cold path is UNMEASURED — they were explicit about not
    # presenting that ~52 as an observation, and it is arithmetic here too. 60
    # still holds, but on the slow end it holds by ~8 minutes, not by the ~58%
    # an average would suggest. A repo at that end should treat adding a project
    # as a bound change, not a config change.
    #
    # ⚠️ 90, NOT 60 — and the raise is not cosmetic. When app.spec.js took S3's
    # per-test budget from 240s to 900s this arithmetic STOPPED FITTING. Projects
    # run SERIALLY (playwright.config.js sets no `workers`; a 2-core runner gives
    # one), so a per-test ceiling is paid once per project — and `retries: 1`
    # means a FAILING scenario pays it twice:
    #
    #     cold install                       21m25s   measured
    #   + test phase, slow end, post-raise    ~38min   claude.trading measured
    #                                                  10.7 + 9.3 + 9.1 for three
    #                                                  profiles; iphone is
    #                                                  unmeasured, inferred ~9.1
    #                                                  from its peer phone profile
    #     -------------------------------------
    #     healthy cold, slow end              ~59.6min  → against 60: no headroom
    #   + ONE S3 retry at the new ceiling      +15min   → ~75min
    #
    # So 60 did not merely get tight: a healthy slow-end cold run now sits AT it,
    # and any S3 failure pushes past. The failure mode is the one this comment
    # exists to prevent, arriving from the other side — GitHub CANCELS the job at
    # the bound, so Playwright never reports the definitive failure and the run
    # reads as inconclusive rather than red. **Raising a per-test budget without
    # raising its enclosing job converts a test failure into a job cancellation.**
    #
    # 90 leaves ~15min over that ~75. Capping S3's sweep instead was considered and
    # rejected: it is uncapped BY DESIGN (test.md → "Coverage = controls clicked,
    # not screens visited"), so a cap would cut mandated coverage to fit a bound —
    # the wrong direction, and the same move as loosening a test to get green.
    #
    # The 57-minute figure in claude.directives' check-job-bounds.py header is NOT a sizing input,
    # however tempting the arithmetic. Read it in context: that run "sat 57
    # minutes on a browser install", cited under "an unbounded job that WEDGES".
    # It is the pathology bounds exist to kill. Size to survive it and you have
    # built a bound that cannot trip on its own purpose.
    #
    # 40 was wrong in the other direction, and the failure mode is why this
    # comment is long: a cancelled run is NOT a red one. It reads as
    # inconclusive, so nobody chases it — the same shape as a viewport never
    # instantiated and a live gate nobody watched. Raise this BEFORE adding
    # projects, never after.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # advisory-run ships 'false': blocking is the default posture for the
      # static/no-backend tier, where the suite runs fully against the bundled
      # local server. A template that shipped 'true' handed every new project a
      # UI suite whose failures show green. Set it 'true' ONLY in a project with
      # a known open UI failure mid-fix, and flip it back as soon as that lands.
      # Auth/backend-gated scenarios self-skip on an empty TEST_AUTH_CREDENTIAL,
      # and qa-live.yml stays the live gate.
      - uses: ./.github/actions/ui-suite
        with:
          tests-dir: ${{ env.UI_TESTS_DIR }}
          app-url: http://localhost:8080
          test-auth-credential: ${{ secrets.TEST_AUTH_CREDENTIAL }}
          artifact-name: playwright-results-local
          app-pages: ${{ vars.APP_PAGES }}
          start-local-server: 'true'
          advisory-run: 'false'
