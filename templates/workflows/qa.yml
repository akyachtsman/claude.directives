# qa.yml — Static checks + Playwright against a local server.
# Copy to .github/workflows/qa.yml in your project, along with the composite
# actions from templates/actions/ into .github/actions/ (secret-scan, ui-suite).
#
# Jobs:
#   static-checks — secret scan (composite) + contrast guardrail; the blocking
#                   gate, runs on every trigger.
#   ui-changes    — diffs the PR against its base and decides whether the
#                   browser job is needed. Non-PR events (push to main)
#                   always run UI tests.
#   ui-tests      — Playwright against a local server via the ui-suite
#                   composite. BLOCKING by default for the static/no-backend
#                   tier (the suite runs fully against the bundled http-server);
#                   set advisory-run: 'true' only as an explicit, temporary
#                   opt-out — and flip it back once the blocking issue is fixed.
#
# Required setup:
#   - Add TEST_AUTH_CREDENTIAL as a repository secret — skip if the project has
#     no auth; the empty secret makes auth tests self-skip
#   - Set UI_TESTS_DIR below to the path of your Playwright test directory
#   - Adjust the UI_PATHS regex in the ui-changes job to your project layout

name: QA — Static + UI Tests

on:
  pull_request:
    branches: [main]
  # push covers only main (the post-merge run). Feature-branch commits are
  # covered by the pull_request trigger — listing them here too made every
  # PR commit run the whole workflow twice. Accepted trade-off: commits
  # pushed before a PR exists get no run; the draft-PR-immediately flow
  # makes that window moments.
  push:
    branches: [main]
  # Manual escape hatch: pull_request event delivery can die provider-side
  # (observed 2026-07-19) — this lets a session or the Actions tab run the
  # gate by hand on any ref. A dispatch run on the PR's head SHA satisfies
  # the merge gate. See docs/standards/ci-triage.md → "CI never registered".
  workflow_dispatch:

# Least privilege: these jobs only read the repo and run tests.
permissions:
  contents: read

env:
  # Path to the directory containing playwright.config.js and package.json
  UI_TESTS_DIR: .github/scripts/ui-tests

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Secret scan (composite — single source of truth for the pattern) ────
      - uses: ./.github/actions/secret-scan

      # ── Contrast guardrail ───────────────────────────────────────────────────
      # WCAG AA check against styles/tokens.css (this project's design tokens).
      # Exits with a notice (no failure) until /design-intake creates tokens.css.
      - name: Contrast guardrail (WCAG AA)
        run: node .github/scripts/check-contrast.js


      - name: Workflow cross-reference guard
        # Every `workflow_run.workflows:` entry must name a real workflow. GitHub
        # raises no error when one does not — the watcher simply never fires.
        run: python3 .github/scripts/workflow-ref-guard.py
  ui-changes:
    name: Detect UI-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.diff.outputs.ui }}

    steps:
      - name: Checkout (full history for base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against PR base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Per-project: paths whose changes warrant a browser run. Includes
          # js/ and styles/ (a source-only change must not skip the browser
          # job) and .github/actions/ (changes to the composites are exercised
          # pre-merge).
          # Any deployed .html is an entry point, not just the root one: with
          # APP_PAGES=admin.html, a PR touching only admin.html used to set
          # ui=false and skip the very ENTRY gate that page exists for.
          UI_PATHS: '^([^/]*\.html$|js/|styles/|\.github/actions/|\.github/scripts/ui-tests/|\.github/workflows/qa\.yml$)'
        run: |
          # This job gates the LOCAL suite, which serves the repo root as static
          # files. That can only test a static-tier app.
          #
          # A production-tier (Next) repo is deliberately NOT enabled here: there
          # is no build step in this job, so http-server would serve a directory
          # listing at / and Playwright would assert against THAT — a green run
          # that never loaded the application. qa-live.yml is the gate for that
          # tier, and it now fires on deployment_status.
          if [ ! -f index.html ]; then
            echo "ui=false" >> "$GITHUB_OUTPUT"
            if [ -d app ]; then
              echo "::notice::Next-tier repo (app/, no index.html) — the local static suite cannot run a Next app; qa-live.yml is the authoritative gate for this tier."
            else
              echo "No index.html yet — skipping browser job."
            fi
            exit 0
          fi
          # Non-PR events (push to main) always run UI tests unconditionally.
          if [ "$EVENT" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — UI tests run unconditionally."
            exit 0
          fi
          # Capture the diff FIRST and fail loudly if git could not produce it.
          # Piping straight into grep hides the failure: `-e` is suspended inside
          # an `if` condition and there is no pipefail here, so an unresolvable
          # BASE_SHA (shallow fetch, force-push, fork PR) makes git error, grep
          # see nothing, and the job report "No UI-relevant changes" — silently
          # skipping the browser tests on a PR that may be entirely UI.
          if ! files=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "::error::could not diff $BASE_SHA...HEAD — refusing to guess whether UI tests are needed."
            exit 1
          fi
          if printf '%s\n' "$files" | grep -qE "$UI_PATHS"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "UI-relevant changes detected."
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No UI-relevant changes — skipping browser job."
          fi

  ui-tests:
    name: UI Tests (local server)
    needs: [static-checks, ui-changes]
    if: needs.ui-changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # ⚠️ 40, NOT 20. This job runs ui-suite, whose COLD-cache path is
    # `playwright install --with-deps chromium webkit` — measured at 21m25s
    # (apfp.claude, run 32267163505). A 20-minute bound therefore killed every
    # cold run before the tests began, and because `actions/cache` saves at job
    # END the kill also skipped the save, leaving the next run equally cold. A
    # bound below the work it bounds does not protect anything; it fails on a
    # schedule. Warm runs finish in ~5 minutes, so this ceiling only ever applies
    # to the cold path it exists to survive.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # advisory-run ships 'false': blocking is the default posture for the
      # static/no-backend tier, where the suite runs fully against the bundled
      # local server. A template that shipped 'true' handed every new project a
      # UI suite whose failures show green. Set it 'true' ONLY in a project with
      # a known open UI failure mid-fix, and flip it back as soon as that lands.
      # Auth/backend-gated scenarios self-skip on an empty TEST_AUTH_CREDENTIAL,
      # and qa-live.yml stays the live gate.
      - uses: ./.github/actions/ui-suite
        with:
          tests-dir: ${{ env.UI_TESTS_DIR }}
          app-url: http://localhost:8080
          test-auth-credential: ${{ secrets.TEST_AUTH_CREDENTIAL }}
          artifact-name: playwright-results-local
          app-pages: ${{ vars.APP_PAGES }}
          start-local-server: 'true'
          advisory-run: 'false'
