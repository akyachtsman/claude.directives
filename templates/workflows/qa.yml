# qa.yml — Static checks + Playwright against a local server.
# Copy to .github/workflows/qa.yml in your project, along with the composite
# actions from templates/actions/ into .github/actions/ (secret-scan, ui-suite).
#
# Jobs:
#   static-checks — secret scan (composite), contrast guardrail, and the
#                   workflow-ref, job-bounds, Python-compile and ui-suite env
#                   guards; the blocking gate, runs on every trigger.
#   ui-changes    — diffs the PR against its base and decides whether the
#                   browser job is needed. Non-PR events (push to main)
#                   always run UI tests.
#   ui-tests      — Playwright against a local server via the ui-suite
#                   composite. BLOCKING by default for the static/no-backend
#                   tier (the suite runs fully against the bundled http-server);
#                   set advisory-run: 'true' only as an explicit, temporary
#                   opt-out — and flip it back once the blocking issue is fixed.
#
# Required setup:
#   - Add TEST_AUTH_CREDENTIAL as a repository secret only when the app's login
#     needs a credential supplied from outside (and TEST_AUTH_EMAIL as well for
#     email+password and identifier-first/split-step gates — directives#304,
#     #310; without it a split-step gate is not even DETECTED and the
#     authenticated scenarios run against the identifier screen). Leave both
#     unset when the app has no auth (auth tests self-skip) or when its login
#     ships a working credential in a visible, editable password field (the
#     suite submits it; a secret would overwrite it — directives#312).
#     docs/standards/cicd-setup.md -> Step 5.
#   - Set UI_TESTS_DIR below to the path of your Playwright test directory
#   - Adjust the UI_PATHS regex in the ui-changes job to your project layout
#   - A project with the CI-build opt-in (global.md -> Hosting & Deployment)
#     sets BUILD_CMD and SITE_DIR below to the SAME values as its
#     pages-deploy.yml, and BUILD_PATHS to its build inputs (required with a
#     build: the change detection refuses to run without it). The browser job
#     then runs the build and serves SITE_DIR, so it tests what is deployed,
#     and a change to a build input alone still runs it. Without the opt-in
#     leave all three as shipped: no build, the repo root is served. It serves
#     the tree UNFILTERED (dotfiles and deny-listed paths included), so it
#     tests the site's behaviour, not what pages-deploy.yml leaves out; it does
#     refuse what that deploy refuses (a SITE_DIR outside the repository, or a
#     symlink in the site), so a green PR cannot merge into a red deploy.

name: QA — Static + UI Tests

on:
  pull_request:
    branches: [main]
  # push covers only main (the post-merge run). Feature-branch commits are
  # covered by the pull_request trigger — listing them here too made every
  # PR commit run the whole workflow twice. Accepted trade-off: commits
  # pushed before a PR exists get no run; the draft-PR-immediately flow
  # makes that window moments.
  push:
    branches: [main]
  # Manual escape hatch: pull_request event delivery can die provider-side
  # (observed 2026-07-19) — this lets a session or the Actions tab run the
  # gate by hand on any ref. A dispatch run on the PR's head SHA satisfies
  # the merge gate. See docs/standards/ci-triage.md → "CI never registered".
  workflow_dispatch:

# Least privilege: these jobs only read the repo and run tests.
permissions:
  contents: read

env:
  # Path to the directory containing playwright.config.js and package.json
  UI_TESTS_DIR: .github/scripts/ui-tests
  # CI-build opt-in only (header). BUILD_CMD runs from the repo root and writes
  # SITE_DIR; empty BUILD_CMD means no build and SITE_DIR stays '.'.
  BUILD_CMD: ''
  SITE_DIR: '.'
  # Extended regex of the build INPUTS, matched against the PR file list beside
  # UI_PATHS, e.g. '^src/|^package(-lock)?\.json$|^tsconfig\.json$|^tailwind\.config\.'.
  # Empty: nothing beyond UI_PATHS.
  BUILD_PATHS: ''

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Secret scan (composite — single source of truth for the pattern) ────
      - uses: ./.github/actions/secret-scan

      # ── Contrast guardrail ───────────────────────────────────────────────────
      # WCAG AA check against this project's design tokens — styles/tokens.css or
      # css/tokens.css by default; elsewhere, append `--tokens <file>` (repeat it
      # per theme file). With no stylesheet at all it exits with a notice (no
      # failure) until /design-intake creates tokens.css; once the project has
      # any CSS, a missing tokens file FAILS the check.
      - name: Contrast guardrail (WCAG AA)
        run: node .github/scripts/check-contrast.js


      - name: Workflow cross-reference guard
        # Every `workflow_run.workflows:` entry must name a real workflow. GitHub
        # raises no error when one does not — the watcher simply never fires.
        run: python3 .github/scripts/workflow-ref-guard.py

      - name: Job bounds guard
        # ENFORCED: every job bounded, none >= 360, ui-suite callers >= 120.
        # Without this step the 120 below is a NUMBER IN A COMMENT: an edit back
        # to 40 passes CI and then cancels healthy cold runs, which read as
        # inconclusive rather than red, so nobody chases them.
        # ADVISORY: the direct-`playwright install` floor of 30 prints and never
        # fails the build — identifying a playwright invocation inside a `run:`
        # block means parsing bash, and the heuristic is not sound enough to gate
        # on (rule 3 in the script header). Do not read a green run as proof that
        # floor was met. Scans .github/workflows; it skips templates/workflows,
        # which only claude.directives has, and says so.
        run: python3 .github/scripts/check-job-bounds.py

      - name: Tracked Python compiles without warnings
        # A `\` in a plain (non-raw) docstring is invisible on 3.11, a
        # SyntaxWarning on 3.12, and a SyntaxError on 3.15 — at which point the
        # guard carrying it stops running and stops checking. This compiles every
        # tracked .py with warnings promoted to errors, so the class cannot come
        # back silently on a future interpreter. Cheap: no imports, no execution.
        run: python3 .github/scripts/check-py-warnings.py

      - name: ui-suite composite env parity
        # The composite's viewport checks IMPORT the Playwright config, so a
        # variable added to its run step and not to the check steps makes the
        # check read a DIFFERENT config from the one the suite runs: green check,
        # different run. This compares the steps, and checks every process.env
        # read in the kit is wired from an input. A variable that needs no input
        # (set outside the composite, by a self-hosted runner say, or never set
        # in CI because its reader handles unset) goes in
        # .github/ui-suite-env-exempt.json as {"NAME": "why it needs none"}, never
        # in the script, so the next template refresh keeps it. --kit-dir is the
        # same UI_TESTS_DIR the ui-suite runs: a moved kit left the guard scanning
        # the default (Codex, #395).
        run: python3 .github/scripts/check-ui-suite-env.py --kit-dir "$UI_TESTS_DIR"
  ui-changes:
    name: Detect UI-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.diff.outputs.ui }}

    steps:
      - name: Checkout (full history for base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deploy parity that must not depend on the diff: the browser job is
      # skipped on a PR touching no UI path, but a symlink added anywhere in
      # an unbuilt site (notes.md, a .png) still fails pages-deploy.yml. So
      # without a build the symlink check runs here, on every PR; with one,
      # the browser job checks the built output (it always runs then).
      - name: Symlinks in the unbuilt site
        if: env.BUILD_CMD == ''
        run: |
          src="${SITE_DIR%/}"; [ -n "$src" ] || src="."
          [ -d "$src" ] || exit 0
          links=$(find "$src" \( -name .git -o -name .github -o -name node_modules \) -prune -o -type l -printf '%P -> %l\n')
          if [ -n "$links" ] && [ -f .github/workflows/pages-deploy.yml ]; then
            echo "::error::symlinks in the site, which pages-deploy.yml refuses; replace them with real files:"
            printf '%s\n' "$links"
            exit 1
          elif [ -n "$links" ]; then
            echo "::warning::symlinks in the site; pages-deploy.yml (Actions-source) refuses them: $(printf '%s; ' "$links")"
          fi

      - name: Diff against PR base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Per-project: paths whose changes warrant a browser run. Matches any
          # .css, .js or .mjs file by extension, wherever it lives, plus js/ and
          # styles/ (a source-only change must not skip the browser job): a
          # css/app.css or a root-level app.js is a layout the kit supports
          # (check-contrast.js looks in css/ by default), and a matcher listing
          # only js/ and styles/ let such a PR set ui=false (audit, 2026-10-06).
          # .github/actions/ is included so changes to the composites are
          # exercised pre-merge.
          # ANY deployed .html is an entry point, nested ones included: APP_PAGES
          # advertises paths like vendor/console.html, and a matcher anchored to
          # root-level files let a PR touching only that page set ui=false and
          # skip the very ENTRY gate the page exists for.
          UI_PATHS: '(\.(html|css|m?js)$|^js/|^styles/|^\.github/actions/|^\.github/scripts/ui-tests/|^\.github/workflows/qa\.yml$)'
        run: |
          # A build whose inputs are not listed would let a source-only PR skip
          # the browser job: refuse the configuration rather than guess.
          # Normalised as pages-deploy.yml does: '' and '/' mean the repo root.
          src="${SITE_DIR%/}"; [ -n "$src" ] || src="."
          if [ -n "$BUILD_CMD" ] && [ -z "${BUILD_PATHS//[[:space:]]/}" ]; then
            echo "::error::BUILD_CMD is set but BUILD_PATHS is empty: list the build inputs (workflow env) so a change to them runs the UI suite."
            exit 1
          fi
          # This job gates the LOCAL suite, which serves SITE_DIR as static
          # files, so it needs a static entry point. Enabling it for a repo with
          # no index.html would hand Playwright a directory listing to assert
          # against — a green run that never loaded an application. With a
          # build, SITE_DIR does not exist yet: the browser job checks its
          # index.html after building, and refuses there instead.
          if [ -z "$BUILD_CMD" ] && [ ! -f "$src/index.html" ]; then
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No index.html yet — skipping browser job."
            exit 0
          fi
          # Non-PR events (push to main) always run UI tests unconditionally.
          if [ "$EVENT" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — UI tests run unconditionally."
            exit 0
          fi
          # Capture the diff FIRST and fail loudly if git could not produce it.
          # Piping straight into grep hides the failure: `-e` is suspended inside
          # an `if` condition and there is no pipefail here, so an unresolvable
          # BASE_SHA (shallow fetch, force-push, fork PR) makes git error, grep
          # see nothing, and the job report "No UI-relevant changes" — silently
          # skipping the browser tests on a PR that may be entirely UI.
          if ! files=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "::error::could not diff $BASE_SHA...HEAD — refusing to guess whether UI tests are needed."
            exit 1
          fi
          pattern="$UI_PATHS"
          [ -n "${BUILD_PATHS//[[:space:]]/}" ] && pattern="${pattern}|${BUILD_PATHS}"
          # grep exits 2 on a malformed pattern; inside an `if` that read as
          # "no match" and skipped the suite. Only 0 and 1 are answers.
          rc=0
          printf '%s\n' "$files" | grep -qE -- "$pattern" || rc=$?
          case "$rc" in
            0) echo "ui=true" >> "$GITHUB_OUTPUT"
               echo "UI-relevant changes detected." ;;
            1) echo "ui=false" >> "$GITHUB_OUTPUT"
               echo "No UI-relevant changes — skipping browser job." ;;
            *) echo "::error::UI_PATHS/BUILD_PATHS is not a valid extended regex (grep exit $rc): fix the pattern."
               exit 1 ;;
          esac

  ui-tests:
    name: UI Tests (local server)
    needs: [static-checks, ui-changes]
    if: needs.ui-changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # 120 is the fleet FLOOR for a ui-suite caller — UI_SUITE_FLOOR in check-job-bounds.py,
    # which enforces it. Set HIGHER if your suite needs it, never lower, and raise it BEFORE
    # adding projects. Why 120 (measurements, arithmetic, what it does NOT cover): the
    # CALLER BOUND section of .github/actions/ui-suite/action.yml's header.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI-build opt-in only: build exactly as pages-deploy.yml does and serve
      # its output, so the suite tests what is deployed rather than the
      # unbuilt tree. With BUILD_CMD empty these two steps are skipped.
      - name: Setup Node (build)
        if: env.BUILD_CMD != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        if: env.BUILD_CMD != ''
        run: bash -eo pipefail -c "$BUILD_CMD"

      # Refuse what pages-deploy.yml refuses, so a green PR cannot merge into a
      # red deploy: a site directory resolving outside the repository, or a
      # symlink in the site (the deploy publishes link TARGETS). A symlink fails
      # where that deploy is installed (.github/workflows/pages-deploy.yml) or a
      # build implies it (the opt-in is Actions-source); otherwise the repo is
      # branch-source, where the managed build publishes links differently, so
      # it only warns. Also exports the normalised directory ('' and '/'
      # mean the repo root) to serve, as a step output.
      - name: Check the site directory
        id: site
        run: |
          src="${SITE_DIR%/}"; [ -n "$src" ] || src="."
          if [ ! -f "$src/index.html" ]; then
            echo "::error::$src/index.html is missing: nothing for the suite to load."
            exit 1
          fi
          ws=$(realpath -e .)
          real=$(realpath -e -- "$src")
          case "$real/" in
            "$ws"/*) ;;
            *) echo "::error::SITE_DIR=$SITE_DIR resolves to $real, outside the repository; pages-deploy.yml refuses it."; exit 1 ;;
          esac
          links=$(find "$real" \( -name .git -o -name .github -o -name node_modules \) -prune -o -type l -printf '%P -> %l\n')
          if [ -n "$links" ] && { [ -n "$BUILD_CMD" ] || [ -f .github/workflows/pages-deploy.yml ]; }; then
            echo "::error::symlinks in the site, which pages-deploy.yml refuses; replace them with real files:"
            printf '%s\n' "$links"
            exit 1
          elif [ -n "$links" ]; then
            echo "::warning::symlinks in the site; pages-deploy.yml (Actions-source) refuses them: $(printf '%s; ' "$links")"
          fi
          echo "root=$src" >> "$GITHUB_OUTPUT"

      # advisory-run ships 'false': blocking is the default posture for the
      # static/no-backend tier, where the suite runs fully against the bundled
      # local server. A template that shipped 'true' handed every new project a
      # UI suite whose failures show green. Set it 'true' ONLY in a project with
      # a known open UI failure mid-fix, and flip it back as soon as that lands.
      # Auth/backend-gated scenarios self-skip when no credential is available
      # (TEST_AUTH_CREDENTIAL empty and the login form ships none), and
      # qa-live.yml stays the live gate.
      - uses: ./.github/actions/ui-suite
        with:
          tests-dir: ${{ env.UI_TESTS_DIR }}
          app-url: http://localhost:8080
          test-auth-credential: ${{ secrets.TEST_AUTH_CREDENTIAL }}
          test-auth-email: ${{ secrets.TEST_AUTH_EMAIL }}
          # VARIABLES, not secrets: selectors and a URL substring, and a masked one
          # is unreadable in a failure message. Empty keeps the windowed answer (#320)
          # and S2 reading the gate clearing as success (#379).
          test-auth-ready-selector: ${{ vars.TEST_AUTH_READY_SELECTOR }}
          test-auth-ready-request: ${{ vars.TEST_AUTH_READY_REQUEST }}
          test-auth-success-selector: ${{ vars.TEST_AUTH_SUCCESS_SELECTOR }}
          artifact-name: playwright-results-local
          app-pages: ${{ vars.APP_PAGES }}
          start-local-server: 'true'
          server-root: ${{ steps.site.outputs.root }}
          advisory-run: 'false'
