# qa.yml — static checks + Playwright against a local server, on every PR to
# main, every push to main and by hand. A CALLER: copy it to
# .github/workflows/qa.yml. The checks run in claude.directives'
# .github/workflows/shared-qa.yml at the release pinned below, with the
# secret-scan and ui-suite composites and the shared scripts read from
# claude.directives at that same commit, so the project carries none of them.
# Pins, releases and what a project keeps: docs/standards/cicd-setup.md ->
# Callers and pins.
#
# What to set (every input, with its default: the `inputs:` of shared-qa.yml):
#   - tests-dir: the directory holding the project's playwright.config.js.
#   - CI-build opt-in only (global.md -> Hosting & Deployment): build-cmd and
#     site-dir, the SAME values as pages-deploy.yml, and BUILD_PATHS below.
#     Without the opt-in leave all three as shipped: no build, the repo root
#     is served.
#   - contrast-script: a project that added pairs to its own copy of
#     check-contrast.js names that copy; without it the shipped pairs run.
#   - TEST_AUTH_CREDENTIAL / TEST_AUTH_EMAIL repository secrets: set them only
#     for a login that needs a credential from outside. Which gates need which,
#     and when to leave both unset: docs/standards/cicd-setup.md -> Step 5.
#     Pass each by name: `secrets: inherit` is documented only inside one
#     organization or enterprise.
#   - Checks of the project's own (a path guard, unit tests) go in a SIBLING
#     job that `qa` lists in `needs:`, so a red project check stops the suite:
#
#       project-checks:
#         name: Project Checks
#         runs-on: ubuntu-latest
#         timeout-minutes: 5
#         steps:
#           - uses: actions/checkout@v7
#           - run: node --test tests/
#       qa:
#         needs: [project-checks]
#         uses: ...
#
# The called jobs' checks read "qa / Static Checks" and "qa / UI Tests (local
# server)": a branch rule that requires checks by name names these.

name: QA — Static + UI Tests

on:
  pull_request:
    branches: [main]
  # push covers only main (the post-merge run). Feature-branch commits are
  # covered by the pull_request trigger — listing them here too made every
  # PR commit run the whole workflow twice. Accepted trade-off: commits
  # pushed before a PR exists get no run; the draft-PR-immediately flow
  # makes that window moments.
  push:
    branches: [main]
  # Manual escape hatch: pull_request event delivery can die provider-side
  # (observed 2026-07-19) — this lets a session or the Actions tab run the
  # gate by hand on any ref. A dispatch run on the PR's head SHA satisfies
  # the merge gate. See docs/standards/ci-triage.md → "CI never registered".
  workflow_dispatch:

# Least privilege: these jobs only read the repo and run tests. A called
# workflow can narrow this, never widen it.
permissions:
  contents: read

env:
  # Extended regex of the build INPUTS, e.g.
  # '^src/|^package(-lock)?\.json$|^tsconfig\.json$|^tailwind\.config\.'.
  # Not read by any workflow: the toolkit's Pages edit reminder reads it here
  # to know which edits change the deployed site. Empty: no build.
  BUILD_PATHS: ''

jobs:
  qa:
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa.yml@v1
    with:
      tests-dir: .github/scripts/ui-tests
      build-cmd: ''
      site-dir: '.'
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}
